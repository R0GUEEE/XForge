name: Publish unsigned XForge IPA

on:
  workflow_run:
    workflows:
      - Build unsigned XForge IPA
    types:
      - completed

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download packaged IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: XForge-unsigned-ipa
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Remove orphaned empty draft release for this tag
        uses: actions/github-script@v7
        env:
          TAG_NAME: xforge-${{ github.event.workflow_run.run_number }}
        with:
          script: |
            const tag = process.env.TAG_NAME;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });
            const release = releases.find((candidate) => candidate.tag_name === tag);
            if (!release || !release.draft || release.assets.length !== 0) {
              core.info(`No orphaned empty draft release found for ${tag}.`);
              return;
            }

            core.info(`Deleting orphaned empty draft release ${release.id} for ${tag}.`);
            await github.rest.repos.deleteRelease({
              owner,
              repo,
              release_id: release.id,
            });

            try {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `tags/${tag}`,
              });
              core.info(`Deleted orphaned tag ${tag}.`);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              core.info(`No orphaned tag ${tag} to delete.`);
            }

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: xforge-${{ github.event.workflow_run.run_number }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: XForge 0.5.0 — provisioned Alpine terminal
          files: dist/XForge-0.5.0-unsigned.ipa
          body_path: CHANGELOG.md
          generate_release_notes: false
