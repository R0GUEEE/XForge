name: Bridge API Check

# The fast loop for the one step that keeps failing.
#
# `Native iOS Toolchain` spends 40-90 minutes building LLVM and Swift before it
# reaches the bridge compile-check, and that check needs none of those libraries: it
# needs the headers of the LLVM and Swift the bundle will be built from, the headers
# those builds *generate*, and a compiler. All of that is already in the two caches
# the toolchain workflow restores, so this workflow restores them, reconfigures (which
# keeps the generated headers in step with the sources), and compiles the bridge —
# about ten minutes instead of an afternoon.
#
# It is not a substitute for the toolchain build: nothing here links anything, so it
# says nothing about the archive, the staging step or the app. It answers one
# question — "does the bridge compile against this LLVM generation?" — which is the
# question that has been costing hours.

on:
  workflow_dispatch:
    inputs:
      swift_ref:
        type: string
        default: swift-6.2.4-RELEASE
      swift_llvm_ref:
        type: string
        default: swift/release/6.2
      with_swift:
        description: Compile the bridge with the Swift frontend code path enabled
        type: boolean
        default: true
  pull_request:
    paths:
      - "App/NativeToolchain/**"
      - ".github/workflows/bridge-api-check.yml"
  push:
    branches:
      - drop-alpine
      - native-toolchain-poc
    paths:
      - "App/NativeToolchain/**"
      - ".github/workflows/bridge-api-check.yml"

jobs:
  api-check:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      IOS_DEPLOYMENT_TARGET: "17.0"
      SWIFT_REF: ${{ inputs.swift_ref || 'swift-6.2.4-RELEASE' }}
      SWIFT_LLVM_REF: ${{ inputs.swift_llvm_ref || 'swift/release/6.2' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install cmake ninja

      - name: Checkout LLVM
        uses: actions/checkout@v4
        with:
          repository: swiftlang/llvm-project
          ref: ${{ env.SWIFT_LLVM_REF }}
          path: llvm-project
          fetch-depth: 1

      - name: Checkout Swift
        if: ${{ inputs.with_swift || github.event_name != 'workflow_dispatch' }}
        uses: actions/checkout@v4
        with:
          repository: swiftlang/swift
          ref: ${{ env.SWIFT_REF }}
          path: swift
          fetch-depth: 1

      - name: Checkout cmark
        if: ${{ inputs.with_swift || github.event_name != 'workflow_dispatch' }}
        uses: actions/checkout@v4
        with:
          repository: swiftlang/swift-cmark
          ref: release/6.2
          path: swift-cmark
          fetch-depth: 1

      - name: Checkout swift-syntax
        if: ${{ inputs.with_swift || github.event_name != 'workflow_dispatch' }}
        uses: actions/checkout@v4
        with:
          repository: swiftlang/swift-syntax
          ref: release/6.2
          path: swift-syntax
          fetch-depth: 1

      - name: Checkout swift-experimental-string-processing
        if: ${{ inputs.with_swift || github.event_name != 'workflow_dispatch' }}
        uses: actions/checkout@v4
        with:
          repository: swiftlang/swift-experimental-string-processing
          ref: release/6.2
          path: swift-experimental-string-processing
          fetch-depth: 1

      - name: Identify the iOS compiler toolchain
        id: toolchain-versions
        run: |
          {
            echo "value=$(xcodebuild -version | tr '\n' ' ')-$(xcrun --sdk iphoneos --show-sdk-version)"
          } >> "$GITHUB_OUTPUT"

      # The build trees, from the last toolchain run that produced them. This is what
      # makes the staging and link half checkable in minutes: the archives and
      # generated headers are the expensive part, and they arrive as an artifact
      # rather than as a cache entry that may or may not be there.
      - name: Download the build trees
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p build-trees
          if gh run download --repo "$GITHUB_REPOSITORY" --name XForgeBuildTrees --dir build-trees; then
            tar -xf build-trees/build-trees.tar
            echo "build trees restored:"
            ls -d llvm-build/lib swift-build/lib cmark-ios-build 2>/dev/null || true
          else
            echo "::warning::no XForgeBuildTrees artifact yet; falling back to the caches, then to configure only"
          fi

      # The same keys the toolchain workflow writes, so this reuses what it built.
      - name: Restore the LLVM builds
        id: llvm-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            llvm-host-build
            llvm-build
            cmark-host-build
            cmark-ios-build
          key: ${{ runner.os }}-${{ runner.arch }}-llvm-${{ steps.toolchain-versions.outputs.value }}-${{ env.SWIFT_LLVM_REF }}-${{ env.IOS_DEPLOYMENT_TARGET }}-${{ inputs.cache_salt || '2' }}

      - name: Restore the Swift build
        id: swift-cache
        uses: actions/cache/restore@v4
        with:
          path: swift-build
          key: ${{ runner.os }}-${{ runner.arch }}-swift-${{ env.SWIFT_REF }}-${{ env.SWIFT_LLVM_REF }}-${{ steps.toolchain-versions.outputs.value }}-${{ env.IOS_DEPLOYMENT_TARGET }}-1

      - name: Report what was available
        run: |
          set -euxo pipefail
          echo "llvm cache hit: ${{ steps.llvm-cache.outputs.cache-hit }}"
          echo "swift cache hit: ${{ steps.swift-cache.outputs.cache-hit }}"
          ls llvm-build/include 2>/dev/null | head -5 || echo "no llvm-build/include"
          ls llvm-build/tools/clang/include/clang/Basic/DiagnosticGroups.inc 2>/dev/null \
            || echo "no generated clang headers (expected on a cold cache)"
          ls swift-build/include 2>/dev/null | head -5 || echo "no swift-build/include"

      # Configure both trees so the generated headers match the sources, then make
      # everything newer than the checkouts — the same reason the toolchain workflow
      # does it: restored outputs look older than a fresh checkout.
      - name: Configure LLVM for iPhoneOS arm64
        shell: bash
        run: |
          set -euxo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          cmake -S llvm-project/llvm -B llvm-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_MACOSX_BUNDLE=OFF \
            -DCMAKE_OSX_SYSROOT="$SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            -DCMAKE_C_COMPILER_TARGET=arm64-apple-ios$IOS_DEPLOYMENT_TARGET \
            -DCMAKE_CXX_COMPILER_TARGET=arm64-apple-ios$IOS_DEPLOYMENT_TARGET \
            -DLLVM_HOST_TRIPLE=arm64-apple-ios$IOS_DEPLOYMENT_TARGET \
            -DLLVM_DEFAULT_TARGET_TRIPLE=arm64-apple-ios$IOS_DEPLOYMENT_TARGET \
            -DLLVM_HOST_BUILD_DIR="$PWD/llvm-host-build" \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_TARGETS_TO_BUILD=AArch64 \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_TOOLS=ON \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_CURL=OFF \
            -DLLVM_ENABLE_RTTI=ON \
            -DCLANG_INCLUDE_TESTS=OFF \
            -DCLANG_BUILD_TOOLS=ON

      - name: Build native cmark
        if: ${{ inputs.with_swift || github.event_name != 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euxo pipefail
          if [ -x cmark-host-build/src/cmark-gfm ]; then
            echo "native cmark already cached"
            exit 0
          fi
          cmake -S swift-cmark -B cmark-host-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMARK_TESTS=OFF
          cmake --build cmark-host-build --target cmark-gfm
          ln -sf "$PWD/cmark-host-build/src/cmark-gfm" cmark-host-build/src/cmark

      - name: Build cmark for iPhoneOS
        if: ${{ inputs.with_swift || github.event_name != 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euxo pipefail
          if [ -f cmark-ios-build/src/libcmark-gfm.a ]; then
            echo "iOS cmark already cached"
            exit 0
          fi
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          # CMAKE_SYSTEM_NAME=Darwin, not iOS, for the same reason the Swift
          # configure uses it: on iOS CMake refuses \`install(TARGETS ...)\` for an
          # executable without a BUNDLE destination, and cmark installs its
          # command-line tool. The target is still iOS — sysroot, architecture and
          # compiler target below say so — and nothing is installed here anyway.
          # Static archives are cmark's default; naming CMARK_TESTS/CMARK_SHARED here
          # only produces "manually-specified variables were not used" warnings.
          cmake -S swift-cmark -B cmark-ios-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Darwin \
            -DCMAKE_OSX_SYSROOT="$SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            -DCMAKE_C_COMPILER_TARGET=arm64-apple-ios$IOS_DEPLOYMENT_TARGET \
            -DCMAKE_CXX_COMPILER_TARGET=arm64-apple-ios$IOS_DEPLOYMENT_TARGET
          # cmark-gfm-extensions is a separate archive and swift's Markup references
          # symbols from both.
          # The *library* targets are libcmark-gfm and libcmark-gfm-extensions; the
          # bare names are the command-line tool, which only the host build needs.
          ninja -C cmark-ios-build libcmark-gfm libcmark-gfm-extensions
          find cmark-ios-build -name 'libcmark-gfm*.a'

      - name: Configure the Swift frontend for iPhoneOS
        if: ${{ inputs.with_swift || github.event_name != 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euxo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          cmake -S swift -B swift-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Darwin \
            -DCMAKE_OSX_SYSROOT="$SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            -DCMAKE_C_COMPILER_TARGET=arm64-apple-ios$IOS_DEPLOYMENT_TARGET \
            -DCMAKE_CXX_COMPILER_TARGET=arm64-apple-ios$IOS_DEPLOYMENT_TARGET \
            -DCMAKE_Swift_COMPILER="$(xcrun -f swiftc)" \
            -DCMAKE_Swift_COMPILER_TARGET=arm64-apple-ios$IOS_DEPLOYMENT_TARGET \
            -DLLVM_DIR="$PWD/llvm-build/lib/cmake/llvm" \
            -DClang_DIR="$PWD/llvm-build/lib/cmake/clang" \
            -DLLVM_TABLEGEN="$PWD/llvm-host-build/bin/llvm-tblgen" \
            -DCLANG_TABLEGEN="$PWD/llvm-host-build/bin/clang-tblgen" \
            -DSWIFT_NATIVE_LLVM_TOOLS_PATH="$PWD/llvm-host-build/bin" \
            -DSWIFT_NATIVE_CLANG_TOOLS_PATH="$PWD/llvm-host-build/bin" \
            -DSWIFT_NATIVE_SWIFT_TOOLS_PATH="$(dirname "$(xcrun -f swiftc)")" \
            -DSWIFT_PATH_TO_CMARK_BUILD="$PWD/cmark-host-build" \
            -DSWIFT_PATH_TO_CMARK_SOURCE="$PWD/swift-cmark" \
            -DSWIFT_PATH_TO_STRING_PROCESSING_SOURCE="$PWD/swift-experimental-string-processing" \
            -DSWIFT_PATH_TO_SWIFT_SYNTAX_SOURCE="$PWD/swift-syntax" \
            -DSWIFT_HOST_VARIANT=iphoneos \
            -DSWIFT_HOST_VARIANT_SDK=IOS \
            -DSWIFT_HOST_VARIANT_ARCH=arm64 \
            -DSWIFT_DARWIN_DEPLOYMENT_VERSION_IOS="$IOS_DEPLOYMENT_TARGET" \
            -DSWIFT_INCLUDE_TOOLS=ON \
            -DSWIFT_BUILD_DYNAMIC_STDLIB=OFF \
            -DSWIFT_BUILD_STATIC_STDLIB=OFF \
            -DSWIFT_BUILD_SOURCEKIT=OFF \
            -DSWIFT_BUILD_SWIFT_SYNTAX=OFF \
            -DSWIFT_INCLUDE_TESTS=OFF \
            -DSWIFT_INSTALL_COMPONENTS=

      - name: Make the trees newer than the sources
        shell: bash
        run: |
          set -euxo pipefail
          for tree in llvm-host-build llvm-build cmark-host-build cmark-ios-build swift-build; do
            [ -d "$tree" ] && find "$tree" -exec touch -c {} + 2>/dev/null || true
          done

      # The check itself, identical to the toolchain workflow's, so the two cannot
      # drift: the bridge compiled for iOS with the headers of the exact LLVM and
      # Swift the bundle will carry.
      - name: Compile-check XForge bridge against LLVM headers
        shell: bash
        run: |
          set -euxo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          EXTRA_DEFINES=()
          EXTRA_INCLUDES=()
          if [ "${{ inputs.with_swift || github.event_name != 'workflow_dispatch' }}" = "true" ]; then
            EXTRA_DEFINES+=(-DXFORGE_HAS_SWIFT_FRONTEND=1)
            EXTRA_INCLUDES+=(-I swift/include)
            [ -d swift-build/include ] && EXTRA_INCLUDES+=(-I swift-build/include)
            [ -d swift-build/tools/swift/include ] && EXTRA_INCLUDES+=(-I swift-build/tools/swift/include)
          fi
          xcrun --sdk iphoneos clang++ \
            -std=c++20 \
            -arch arm64 \
            -miphoneos-version-min=$IOS_DEPLOYMENT_TARGET \
            -isysroot "$SDK" \
            -DXFORGE_HAS_LLVM=1 \
            "${EXTRA_DEFINES[@]}" \
            -I llvm-project/llvm/include \
            -I llvm-build/include \
            -I llvm-project/clang/include \
            -I llvm-build/tools/clang/include \
            -I llvm-project/lld/include \
            "${EXTRA_INCLUDES[@]}" \
            -I App/NativeToolchain \
            -c App/NativeToolchain/NativeToolchainBridge.mm \
            -o /tmp/NativeToolchainBridge.o
          file /tmp/NativeToolchainBridge.o

      # The staging and link half, deliberately the same commands as the toolchain
      # workflow's: header roots (sources and generated kept apart — `swift/bridging`
      # is a generated file and `swift/Bridging/` a source directory), one merged
      # archive, and a link into an app-shaped target. Without this the fast loop
      # would answer the compile question and leave the link question to a 90-minute
      # run, which is how the cmark symbols went unnoticed.
      - name: Stage the toolchain
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist/include dist/include-generated dist/lib
          stage_headers() { cp -R -L "$1" "$2"; }

          stage_headers llvm-project/llvm/include/llvm dist/include/
          stage_headers llvm-project/clang/include/clang dist/include/
          stage_headers llvm-project/lld/include/lld dist/include/

          [ -d llvm-build/include/llvm ] && stage_headers llvm-build/include/llvm dist/include-generated/
          [ -d llvm-build/tools/clang/include/clang ] && stage_headers llvm-build/tools/clang/include/clang dist/include-generated/

          if [ "${{ inputs.with_swift || github.event_name != 'workflow_dispatch' }}" = "true" ]; then
            stage_headers swift/include/swift dist/include/
            for swift_headers in swift-build/include/swift swift-build/tools/swift/include/swift; do
              [ -d "$swift_headers" ] && stage_headers "$swift_headers" dist/include-generated/
            done
          fi

          find llvm-build/lib -maxdepth 1 -type f -name '*.a' -print | sort > /tmp/archives.txt
          if [ -d cmark-ios-build ]; then
            find cmark-ios-build -type f -name 'libcmark-gfm*.a' -print | sort >> /tmp/archives.txt
          fi
          if [ "${{ inputs.with_swift || github.event_name != 'workflow_dispatch' }}" = "true" ]; then
            find swift-build/lib -maxdepth 3 -type f -name '*.a' -print | sort >> /tmp/archives.txt
          fi
          test -s /tmp/archives.txt
          # Staged unmerged: `libtool -static` de-duplicates members by name
          # ("duplicate member name 'X86.cpp.o' from …"), and a dropped member is a
          # silently missing object — which is precisely how the JIT symbols went
          # undefined while their object was in the archive.
          while IFS= read -r archive; do cp "$archive" dist/lib/; done < /tmp/archives.txt
          cp /tmp/archives.txt dist/lib/XForgeToolchain.libraries.txt
          echo "staged $(wc -l < /tmp/archives.txt) archives, unmerged:"
          ls dist/lib | head -10

      - name: Link an app-shaped target
        shell: bash
        run: |
          set -euxo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          cat > /tmp/native_link_smoke.mm <<'EOF'
          #include "NativeToolchainBridge.h"
          int main(void) {
              return xf_native_toolchain_available() ? 0 : 1;
          }
          EOF
          xcrun --sdk iphoneos clang++ -std=c++20 -arch arm64 \
            -miphoneos-version-min=$IOS_DEPLOYMENT_TARGET -isysroot "$SDK" \
            -I App/NativeToolchain -c /tmp/native_link_smoke.mm -o /tmp/native_link_smoke.o
          set +e
          xcrun --sdk iphoneos clang++ -arch arm64 \
            -miphoneos-version-min=$IOS_DEPLOYMENT_TARGET -isysroot "$SDK" \
            /tmp/native_link_smoke.o /tmp/NativeToolchainBridge.o \
            $(for library in dist/lib/*.a; do printf ' -Wl,-force_load,%s' "$library"; done) \
            -lc++ -lz -liconv -lsqlite3 -framework Foundation \
            -o /tmp/XForgeNativeToolchainSmoke 2> /tmp/native-link-errors.txt
          STATUS=$?
          set -e
          if [ "$STATUS" != "0" ]; then
            echo "::error::linking the toolchain into an app-shaped target failed"
            grep -E '^(  "_|ld: )' /tmp/native-link-errors.txt | sort -u | head -40
            tail -40 /tmp/native-link-errors.txt
            exit 1
          fi
          file /tmp/XForgeNativeToolchainSmoke
