name: Build darwin Swift SDK

# Produces a lean iPhoneOS-only `darwin` Swift SDK bundle (arm64-apple-ios) that the
# embedded Linux needs to cross-compile iOS apps. Uses `darwin-sdk-builder.swift`
# (replicates xtool's SDKBuilder but only for the iPhoneOS platform), so it is much
# faster than `xtool sdk build` (which extracts simulator + macOS SDKs too).
# The result is published as a release asset the app fetches on first use.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-darwin-sdk:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Locate Xcode
        id: xcode
        run: |
          XCODE_APP="$(dirname "$(dirname "$(xcode-select -p)")")"
          echo "Xcode at: $XCODE_APP"
          echo "path=$XCODE_APP" >> "$GITHUB_OUTPUT"

      - name: Build iPhoneOS-only darwin SDK
        run: |
          set -o pipefail
          rm -rf darwin-sdk-out
          swift EmbeddedLinux/darwin-sdk-builder.swift \
            "${{ steps.xcode.outputs.path }}" darwin-sdk-out aarch64 \
            2>&1 | tee /tmp/darwin-sdk.log

      - name: Show size
        run: |
          du -sh darwin-sdk-out
          find darwin-sdk-out -type d -maxdepth 4 | head -30

      - name: Package
        run: |
          set -e
          # strip macOS AppleDouble metadata files copied alongside the SDK
          find darwin-sdk-out -name '._*' -delete
          cd darwin-sdk-out
          tar -cf - darwin.artifactbundle | xz -9e > ../darwin.artifactbundle.tar.xz
          ls -lh ../darwin.artifactbundle.tar.xz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: darwin-xtoolsdk
          path: darwin.artifactbundle.tar.xz
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: darwin-sdk-${{ github.run_number }}
          name: darwin Swift SDK ${{ github.run_number }}
          files: darwin.artifactbundle.tar.xz
          generate_release_notes: false
