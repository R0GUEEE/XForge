name: Build XForge IPA

# Builds the unsigned XForge IPA.
#
# There is no guest to provision and no engine to build: the compiler is linked
# into the app from the toolchain bundle (Vendor/NativeToolchain), which
# `native-toolchain.yml` builds in its own workflow. A checkout without the bundle
# still builds — the bridge compiles to a "not available" stub — so the archive
# here is the app itself, and the Toolchain screen reports what is missing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      # Off by default, and gated again by a repository variable: the IPA now
      # carries Apple SDK content (see Docs/BUNDLED-SDK.md), so publishing it is a
      # redistribution decision, not a side effect of clicking Run. A build still
      # uploads its IPA as a workflow artifact, which is what "prepare it" means.
      release:
        description: Publish the IPA as a GitHub release (needs the XFORGE_PUBLISH_RELEASES repository variable)
        type: boolean
        default: false
      run_tests:
        description: Run simulator unit tests before archiving
        type: boolean
        default: false
      with_toolchain:
        description: Install the published native toolchain bundle and link it into the app (push builds always do)
        type: boolean
        default: true
      toolchain_tag:
        description: Toolchain release tag to install (default - the newest toolchain-* release, or "artifact" for the newest workflow artifact)
        type: string
        default: ""
      # Default true, and push builds always bundle (see the step's `if:`): the
      # delivered IPA is supposed to work without a 456 MB download first.
      bundle_darwin_sdk:
        description: Bundle the Darwin SDK inside the IPA (push builds always do)
        type: boolean
        default: true
      darwin_sdk_tag:
        description: darwin-sdk-* release tag to bundle (default the pinned one)
        type: string
        default: ""
      darwin_sdk_sha256:
        description: SHA-256 of that tag's asset (required when the tag is not the pinned one)
        type: string
        default: ""

permissions:
  contents: write

jobs:
  ipa:
    name: Build the IPA
    runs-on: macos-15
    timeout-minutes: 120
    # Serialized, never cancelled. Each run publishes its own
    # `xforge-<run_number>` tag, so a queued run is not lost — it just waits.
    concurrency:
      group: xforge-ipa
      cancel-in-progress: false
    env:
      APP_PATH: build/XForge.xcarchive/Products/Applications/XForge.app
      DERIVED_DATA_PATH: build/DerivedData
      # Must match XFORGE_MARKETING_VERSION in project.yml; asserted below so a
      # version bump cannot silently produce a mislabelled release.
      EXPECTED_VERSION: "0.5.0"
      SPM_CLONES_DIR: .spm
      # The Darwin SDK this IPA carries. Pinned three ways — tag, byte count and
      # SHA-256 — so a re-uploaded or truncated asset fails the build instead of
      # shipping something nobody verified. Bump all three together; the numbers
      # live in Docs/BUNDLED-SDK.md as well.
      DARWIN_SDK_TAG: darwin-sdk-7
      DARWIN_SDK_ASSET: darwin.artifactbundle.zip
      DARWIN_SDK_BYTES: "456769875"
      DARWIN_SDK_SHA256: b44165c16a5cebf13ae85af4d630f49b863e342b84f864b4dc1bbba5789d4d9b
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the build tools
        run: |
          set -euo pipefail
          # xcodegen generates the Xcode project from project.yml. Nothing else is
          # needed: the compiler comes from the toolchain bundle, and the app
          # unpacks archives with ZIPFoundation.
          if ! brew list --versions xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          else
            echo "Homebrew tools already installed"
          fi

      - name: Identify the iOS compiler toolchain
        id: toolchain-versions
        run: |
          {
            echo "value=$(xcodebuild -version | tr '\n' ' ')-$(clang --version | head -n 1)"
          } >> "$GITHUB_OUTPUT"

      # The build that proves the compiler really is in the app: the bundle is
      # installed where the generated xcconfig points, so the bridge compiles with
      # XFORGE_HAS_LLVM / XFORGE_HAS_SWIFT_FRONTEND and the app *links* the merged
      # archive — the step that no other workflow exercises.
      #
      # From the published release, not a workflow artifact: the toolchain build
      # takes ~90 minutes and its output only changes when an LLVM or Swift revision
      # does, so making the app build depend on a toolchain run would put that cost
      # on every app build for no reason. The tag names its contents, so "the newest
      # `toolchain-*` release" is a well-defined thing to ask for.
      - name: Install the native toolchain bundle
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.with_toolchain) }}
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.toolchain_tag }}
        run: |
          set -euo pipefail
          ARCHIVE_NAME="XForgeNativeToolchain-arm64-ios.tar.gz"
          tag="$REQUESTED_TAG"

          if [ "$tag" = "artifact" ]; then
            # Escape hatch for testing a bundle that was just built and has not been
            # published: the newest artifact of that name.
            echo "installing the newest workflow artifact"
            gh run download --repo "$GITHUB_REPOSITORY" \
              --name XForgeNativeToolchain-arm64-ios --dir .toolchain-artifact
          else
            if [ -z "$tag" ]; then
              # `gh release list` is newest-first, so the first toolchain-* tag is
              # the newest published bundle.
              tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
                --json tagName --jq '[.[] | select(.tagName | startswith("toolchain-"))][0].tagName')"
            fi
            if [ -z "$tag" ] || [ "$tag" = "null" ]; then
              echo "::error::no published toolchain release found."
              echo "Run the 'Native iOS Toolchain' workflow by hand (with_swift=true) and let it publish, or pass toolchain_tag."
              exit 1
            fi
            echo "installing the toolchain bundle from release $tag"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern "XForgeNativeToolchain-*.tar.gz" --dir .toolchain-artifact
          fi

          bash NativeToolchain/install-bundle.sh ".toolchain-artifact/$ARCHIVE_NAME"
          cat Vendor/NativeToolchain/manifest.txt
          cat Support/NativeToolchain.generated.xcconfig

      # The manifest is what the app bundle's compiler is made of, so say what it is
      # before building with it: the SDK the archives and the bridge were compiled
      # against, and the Swift revision the frontend speaks. Both have to line up
      # with what the app will actually compile against on a device — the Darwin SDK
      # it installs at runtime — and neither is visible anywhere else in this log.
      - name: Check the toolchain bundle against this Xcode
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.with_toolchain) }}
        run: |
          set -euo pipefail
          MANIFEST="Vendor/NativeToolchain/manifest.txt"
          get() { sed -n "s/^$1=//p" "$MANIFEST"; }

          echo "bundle: $(get bundle_tag)"
          echo "  built with Xcode $(get xcode), iPhoneOS SDK $(get ios_sdk)"
          echo "  LLVM commit $(get llvm_commit)"

          runner_sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          if [ "$(get ios_sdk)" != "$runner_sdk" ]; then
            echo "::warning::the bundle was built against iPhoneOS SDK $(get ios_sdk) but this runner has $runner_sdk"
          fi

          if ! grep -q '^swift_frontend=1' "$MANIFEST"; then
            echo "this bundle has no Swift frontend; Swift targets will report it missing"
            exit 0
          fi

          # The frontend's own version matters, and the runner's is not it: this
          # Swift is what *bootstrapped* the frontend's build, while the frontend
          # itself comes from the ref below and has to match the Swift version
          # inside the Darwin SDK the app installs on device. Printing both is the
          # point — a mismatch between them is expected and is not a problem; a
          # mismatch between the bundle and the Darwin SDK is, and this step cannot
          # see that one.
          echo "  Swift frontend built from $(get swift_ref)"
          echo "  this runner's Swift (used to bootstrap it): $(xcrun swift --version 2>/dev/null | head -n 1)"

      # Both halves have to be present for the delivered IPA to be able to compile:
      # the compiler is linked in at build time (above), the SDK ships inside the
      # .app (below). This asserts the first, because a toolchain step that quietly
      # installed nothing would otherwise produce a "working" IPA that reports
      # "clang: missing" on the device.
      - name: Verify the compiler is linked in
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.with_toolchain) }}
        run: |
          set -euo pipefail
          test -f Vendor/NativeToolchain/manifest.txt \
            || { echo "::error::no toolchain bundle was installed; the IPA would ship without a compiler"; exit 1; }
          grep -q '^XFORGE_NATIVE_TOOLCHAIN_AVAILABLE = 1' Support/NativeToolchain.generated.xcconfig \
            || { echo "::error::the generated xcconfig does not enable the toolchain"; cat Support/NativeToolchain.generated.xcconfig; exit 1; }
          grep -q 'XFORGE_HAS_LLVM=1' Support/NativeToolchain.generated.xcconfig \
            || { echo "::error::XFORGE_HAS_LLVM is not defined; the bridge would compile to the stub"; exit 1; }
          echo "compiler linked: $(sed -n 's/^bundle_tag=//p' Vendor/NativeToolchain/manifest.txt)"

      - name: Prepare the native toolchain configuration
        run: |
          set -euo pipefail
          if [ -x NativeToolchain/prepare-xcode.sh ] || [ -f NativeToolchain/prepare-xcode.sh ]; then
            bash NativeToolchain/prepare-xcode.sh
          fi
          cat Support/NativeToolchain.generated.xcconfig 2>/dev/null || true

      # ---------------------------------------------------------------------
      # The Darwin SDK inside the IPA.
      #
      # A sideloaded XForge that must download an SDK before it can compile is not
      # "install and use it", so the release build carries one: the pinned
      # `darwin-sdk-*` release asset is copied into `BundledSDK/`, which project.yml
      # turns into a folder-reference resource, and the app installs it on first
      # run (`BundledDarwinSDK`).
      #
      # There is no newest-tag lookup, no `continue-on-error`, and no fallback: the
      # IPA either contains the exact artifact named in the job env or the build
      # fails. `pull_request` builds skip it on purpose — they are not delivered.
      - name: Bundle the Darwin SDK
        # Even a private workflow artifact distributes Xcode SDK content to its
        # authorised artifact downloaders. Until redistribution permission is
        # established, opt-in is limited to an explicit dispatch by the owner.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bundle_darwin_sdk }}
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.darwin_sdk_tag }}
          REQUESTED_SHA: ${{ inputs.darwin_sdk_sha256 }}
        run: |
          set -euo pipefail
          bash Tools/fetch-bundled-sdk.sh "${REQUESTED_TAG}" \
            --sha256 "${REQUESTED_SHA}" --repo "${GITHUB_REPOSITORY}"

          # Export what was actually bundled, so the *final* IPA can be checked
          # against the same numbers the download was checked against.
          python3 - <<'PY'
          import json, os
          with open("BundledSDK/bundled-sdk.json") as handle:
              manifest = json.load(handle)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"BUNDLED_SDK_TAG={manifest['releaseTag']}\n")
              env.write(f"BUNDLED_SDK_SHA={manifest['sha256']}\n")
              env.write(f"BUNDLED_SDK_BYTES={manifest['byteCount']}\n")
          print(f"bundled {manifest['releaseTag']}: {manifest['byteCount']:,} bytes, "
                f"sha256 {manifest['sha256']}")
          PY

          # The step summary is written from the manifest, not from the shell
          # variables above: GITHUB_ENV does not reach the step that wrote it.
          python3 - <<'PY'
          import json, os
          manifest = json.load(open("BundledSDK/bundled-sdk.json"))
          mib = manifest["byteCount"] / 1048576
          lines = [
              "### Bundled Darwin SDK",
              "",
              f"- release: {manifest['releaseTag']}",
              f"- asset: {manifest['assetName']} ({mib:.1f} MiB, {manifest['byteCount']:,} bytes)",
              f"- sha256: `{manifest['sha256']}`",
              f"- sdk version: {manifest.get('sdkVersion') or 'unknown'}",
              "- licensing: Apple SDK content; redistribution not verified (Docs/BUNDLED-SDK.md)",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("\n".join(lines) + "\n")
          PY

      - name: Note the missing SDK
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.bundle_darwin_sdk) }}
        run: |
          echo "::notice::This build does not bundle the Darwin SDK. Release builds (push) always do."

      - name: Generate the Xcode project
        run: |
          mkdir -p BundledSDK
          xcodegen generate --spec project.yml

      - name: Cache Swift package clones
        uses: actions/cache@v4
        with:
          path: .spm
          key: ${{ runner.os }}-spm-${{ hashFiles('project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Swift package dependencies
        run: |
          set -o pipefail
          xcodebuild -project XForge.xcodeproj -scheme XForge \
            -resolvePackageDependencies \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath "$SPM_CLONES_DIR" \
            -derivedDataPath "$DERIVED_DATA_PATH" 2>&1 | tee /tmp/resolve.log

      - name: Run the unit tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_tests }}
        run: |
          set -o pipefail
          xcodebuild -project XForge.xcodeproj -scheme XForge \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -clonedSourcePackagesDirPath "$SPM_CLONES_DIR" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            test 2>&1 | tee /tmp/tests.log

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          rm -rf build/XForge.xcarchive
          xcodebuild -project XForge.xcodeproj -scheme XForge \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath "$SPM_CLONES_DIR" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            archive -archivePath build/XForge.xcarchive 2>&1 | tee /tmp/build.log

      - name: Verify the built app
        run: |
          set -euo pipefail
          test -d "$APP_PATH"
          test -x "$APP_PATH/XForge"

          # Architecture, from the binary itself rather than from the build log.
          binary_info="$(lipo -info "$APP_PATH/XForge")"
          case "$binary_info" in
            *arm64*) ;;
            *) echo "::error::the app binary is not arm64: $binary_info"; exit 1 ;;
          esac
          # NOTE: do not try to prove the compiler is linked by scanning the app
          # binary for LLVM symbols. Xcode's Release configuration strips, and on a
          # stripped binary `nm` reports "no symbols" and finds nothing — so a
          # symbol check fails for a perfectly good build. What the toolchain can do
          # is checked where it is observable: the Toolchain screen's smoke test, on
          # a device.
          size_mb=$(( $(stat -f%z "$APP_PATH/XForge") / 1048576 ))
          echo "app binary: ${binary_info#*: } (${size_mb} MB)"
          test "$size_mb" -gt 1 \
            || { echo '::error::the app binary is implausibly small'; exit 1; }

          # No build leftovers in the bundle.
          strays="$(find "$APP_PATH" \( -name '*.a' -o -name 'meson-*' -o -name 'build.ninja' \) -print -quit)"
          [ -z "$strays" ] \
            || { echo "::error::build leftovers in the app bundle: $strays"; exit 1; }

          # Identity and the icon wiring that makes the app installable.
          PLIST="$APP_PATH/Info.plist"
          test -f "$PLIST"
          test -f "$APP_PATH/Assets.car"
          get() { /usr/libexec/PlistBuddy -c "Print :$1" "$PLIST"; }
          test "$(get CFBundleShortVersionString)" = "${{ env.EXPECTED_VERSION }}"
          test "$(get CFBundleIdentifier)" = "com.r0gueee.xforge"
          test "$(get CFBundleDisplayName)" = "XForge"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon" "$PLIST" >/dev/null

          python3 - <<'PY'
          import plistlib
          required = {
              "get-task-allow",
              "application-identifier",
              "com.apple.developer.kernel.extended-virtual-addressing",
              "com.apple.developer.kernel.increased-memory-limit",
          }
          with open("Support/XForge.entitlements", "rb") as handle:
              entitlements = plistlib.load(handle)
          missing = required - entitlements.keys()
          assert not missing, f"missing entitlements: {sorted(missing)}"
          PY
          settings="$(xcodebuild -project XForge.xcodeproj -scheme XForge \
            -destination 'generic/platform=iOS' -showBuildSettings 2>/dev/null)"
          case "$settings" in
            *XForge.entitlements*) ;;
            *) echo '::error::CODE_SIGN_ENTITLEMENTS is not wired'; exit 1 ;;
          esac

          {
            echo '### Built app'
            echo
            echo "- binary: ${binary_info#*: } (${size_mb} MB)"
            echo "- version: $(get CFBundleShortVersionString)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the bundled SDK in the app
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bundle_darwin_sdk }}
        run: |
          set -euo pipefail
          # A folder reference normally copies to the bundle root; Xcode also emits
          # <App>.app/Resources/<folder> for some targets. The app searches both
          # (BundledDarwinSDK.folder(in:)), so this check does too.
          FOLDER=""
          for candidate in "$APP_PATH/BundledSDK" "$APP_PATH/Resources/BundledSDK"; do
            if [ -d "$candidate" ]; then FOLDER="$candidate"; break; fi
          done
          test -n "$FOLDER" \
            || { echo "::error::the built app has no BundledSDK/ folder"; find "$APP_PATH" -maxdepth 2 -name 'BundledSDK' -print; exit 1; }
          test -f "$FOLDER/$DARWIN_SDK_ASSET" \
            || { echo "::error::$DARWIN_SDK_ASSET did not make it into the app bundle"; exit 1; }
          test -f "$FOLDER/bundled-sdk.json" \
            || { echo "::error::bundled-sdk.json did not make it into the app bundle"; exit 1; }

          # Three independent facts, checked against each other: the file the app
          # will install, the manifest the app will read, and the pin in this file.
          python3 - "$FOLDER" "$DARWIN_SDK_ASSET" "$DARWIN_SDK_SHA256" "$DARWIN_SDK_BYTES" <<'PY'
          import hashlib, json, os, sys, zipfile

          folder, asset, expected_sha, expected_bytes = sys.argv[1:5]
          archive = os.path.join(folder, asset)

          with open(os.path.join(folder, "bundled-sdk.json")) as handle:
              manifest = json.load(handle)

          size = os.path.getsize(archive)
          digest = hashlib.sha256()
          with open(archive, "rb") as handle:
              for chunk in iter(lambda: handle.read(4 * 1024 * 1024), b""):
                  digest.update(chunk)
          digest = digest.hexdigest()

          problems = []
          if digest != expected_sha:
              problems.append(f"sha256 {digest} != pinned {expected_sha}")
          if str(size) != expected_bytes:
              problems.append(f"{size} bytes != pinned {expected_bytes}")
          if manifest.get("sha256") != digest:
              problems.append("bundled-sdk.json does not describe this archive")
          if manifest.get("byteCount") != size:
              problems.append("bundled-sdk.json records a different size")
          if manifest.get("schemaVersion") != 1:
              problems.append(f"unexpected manifest schema {manifest.get('schemaVersion')}")

          with zipfile.ZipFile(archive) as zf:
              metadata = next((n for n in zf.namelist() if n.endswith("swift-sdk.json")), None)
              if metadata is None:
                  problems.append("the archive has no swift-sdk.json")
              else:
                  definition = json.loads(zf.read(metadata))
                  if "arm64-apple-ios" not in definition.get("targetTriples", {}):
                      problems.append("the SDK defines no arm64-apple-ios target")

          if problems:
              for problem in problems:
                  print(f"::error::{problem}")
              sys.exit(1)
          print(f"app bundle carries {manifest['releaseTag']}: {size:,} bytes, sha256 {digest}")
          PY

      - name: Package the unsigned IPA
        run: |
          set -euo pipefail
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")"
          IPA="dist/XForge-$VERSION-unsigned.ipa"
          # Start from an empty dist/. A leftover IPA here would be uploaded
          # alongside the new one (they have different names, so `--clobber`
          # would not replace it), and a release offering two builds of different
          # versions is worse than one that offers none.
          rm -rf dist
          mkdir -p dist/Payload
          ditto "$APP_PATH" dist/Payload/XForge.app
          ditto -c -k --keepParent dist/Payload "$IPA"
          unzip -t "$IPA" >/dev/null

          unzip -Z1 "$IPA" > /tmp/ipa-contents.txt
          grep -q '^Payload/XForge\.app/XForge$' /tmp/ipa-contents.txt \
            || { echo '::error::the IPA does not contain the app executable'; exit 1; }

          # Exactly one IPA, and it is the version the app says it is.
          count="$(find dist -maxdepth 1 -name '*.ipa' | wc -l | tr -d ' ')"
          [ "$count" = "1" ] \
            || { echo "::error::expected exactly one IPA in dist/, found $count:"; ls -la dist; exit 1; }
          test -f "$IPA" || { echo "::error::$IPA was not produced"; exit 1; }

          echo "IPA: $IPA ($(du -h "$IPA" | cut -f1))"
          # GitHub refuses a release asset over 2 GiB. The app is tens of MB, so
          # this only catches a runaway bundle — before the publish step does.
          ipa_bytes="$(stat -f%z "$IPA")"
          if [ "$ipa_bytes" -gt 2000000000 ]; then
            echo "::error::the IPA is $((ipa_bytes / 1048576)) MB, over GitHub's 2 GiB release limit"
            exit 1
          fi
          echo "ipa=$IPA" >> "$GITHUB_ENV"

      - name: Verify the final IPA
        run: |
          set -euo pipefail
          IPA="$ipa"
          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_DIR"' EXIT

          unzip -q "$IPA" -d "$VERIFY_DIR"

          # A sideloadable IPA must contain exactly one application directly
          # below Payload/.
          app_count="$(find "$VERIFY_DIR/Payload" -mindepth 1 -maxdepth 1 -type d -name '*.app' | wc -l | tr -d ' ')"
          [ "$app_count" -eq 1 ] || {
            echo "::error::expected exactly one .app in Payload, found $app_count"
            find "$VERIFY_DIR" -maxdepth 3 -print
            exit 1
          }
          FINAL_APP="$(find "$VERIFY_DIR/Payload" -mindepth 1 -maxdepth 1 -type d -name '*.app' -print -quit)"
          FINAL_PLIST="$FINAL_APP/Info.plist"

          test -f "$FINAL_PLIST" || { echo '::error::IPA app has no Info.plist'; exit 1; }
          test -x "$FINAL_APP/XForge" || { echo '::error::IPA app has no executable XForge binary'; exit 1; }
          test -f "$FINAL_APP/Assets.car" || { echo '::error::IPA app has no compiled asset catalog'; exit 1; }

          get_final() { /usr/libexec/PlistBuddy -c "Print :$1" "$FINAL_PLIST"; }
          [ "$(get_final CFBundleIdentifier)" = "com.r0gueee.xforge" ]             || { echo "::error::wrong bundle identifier in final IPA"; exit 1; }
          [ "$(get_final CFBundleExecutable)" = "XForge" ]             || { echo "::error::wrong CFBundleExecutable in final IPA"; exit 1; }
          [ "$(get_final CFBundleShortVersionString)" = "$EXPECTED_VERSION" ]             || { echo "::error::wrong version in final IPA"; exit 1; }

          final_arch="$(lipo -info "$FINAL_APP/XForge")"
          case "$final_arch" in
            *arm64*) ;;
            *) echo "::error::final IPA executable is not arm64: $final_arch"; exit 1 ;;
          esac

          # Ensure packaging did not alter the application executable.
          original_sha="$(shasum -a 256 "$APP_PATH/XForge" | awk '{print $1}')"
          final_sha="$(shasum -a 256 "$FINAL_APP/XForge" | awk '{print $1}')"
          [ "$original_sha" = "$final_sha" ] || {
            echo "::error::the executable changed while packaging the IPA"
            exit 1
          }

          # The app must be self-contained; a missing executable or Info.plist is
          # what makes an IPA uninstallable, and both were checked above.

          # Reject common malformed packaging layouts.
          [ ! -d "$VERIFY_DIR/Payload/Payload" ]             || { echo '::error::IPA contains a nested Payload/Payload directory'; exit 1; }
          ! find "$VERIFY_DIR" -name '__MACOSX' -print -quit | grep -q .             || { echo '::error::IPA contains __MACOSX metadata'; exit 1; }

          # The delivered IPA must carry the SDK, byte for byte. `if` rather than a
          # separate step so a non-bundled build (PR) still runs the rest of these
          # checks; BUNDLED_SDK_SHA is only set when the bundle step ran.
          if [ "${{ github.event_name }}" = workflow_dispatch ] && [ "${{ inputs.bundle_darwin_sdk }}" = true ]; then
            [ -n "${BUNDLED_SDK_SHA:-}" ] || { echo '::error::SDK dispatch requested but the archive was not fetched'; exit 1; }
          fi
          if [ -n "${BUNDLED_SDK_SHA:-}" ]; then
            FINAL_FOLDER=""
            for candidate in "$FINAL_APP/BundledSDK" "$FINAL_APP/Resources/BundledSDK"; do
              if [ -d "$candidate" ]; then FINAL_FOLDER="$candidate"; break; fi
            done
            [ -n "$FINAL_FOLDER" ] \
              || { echo "::error::the delivered IPA does not contain the bundled Darwin SDK"; exit 1; }
            FINAL_SDK="$FINAL_FOLDER/$DARWIN_SDK_ASSET"
            test -f "$FINAL_SDK" \
              || { echo "::error::the delivered IPA has a BundledSDK folder without $DARWIN_SDK_ASSET"; exit 1; }
            final_sdk_sha="$(shasum -a 256 "$FINAL_SDK" | awk '{print $1}')"
            [ "$final_sdk_sha" = "$BUNDLED_SDK_SHA" ] \
              || { echo "::error::the bundled SDK changed while packaging the IPA ($final_sdk_sha)"; exit 1; }
            final_sdk_bytes="$(stat -f%z "$FINAL_SDK")"
            [ "$final_sdk_bytes" = "$BUNDLED_SDK_BYTES" ] \
              || { echo "::error::the bundled SDK is $final_sdk_bytes bytes, expected $BUNDLED_SDK_BYTES"; exit 1; }
            test -f "$FINAL_FOLDER/bundled-sdk.json" \
              || { echo "::error::the IPA lost bundled-sdk.json"; exit 1; }
            echo "  bundled SDK: $BUNDLED_SDK_TAG, $((final_sdk_bytes / 1048576)) MB, sha256 ${final_sdk_sha:0:16}…"
          fi

          echo "Final IPA verified: $(basename "$IPA")"
          echo "  app: $(basename "$FINAL_APP")"
          echo "  architecture: ${final_arch#*: }"
          echo "  executable sha256: $final_sha"

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: XForge-unsigned-ipa
          path: dist/XForge-${{ env.EXPECTED_VERSION }}-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish the release
        # Explicit authorization, twice: the dispatcher ticks "release" *and* the
        # repository sets XFORGE_PUBLISH_RELEASES=true. The IPA carries Apple's SDK
        # content, so whether it may be redistributed is a question for whoever
        # owns the rights — not something a push should decide on its own.
        if: ${{ inputs.release && vars.XFORGE_PUBLISH_RELEASES == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          # Not `xforge-<run_number>`. `run_number` restarts at 1 whenever a
          # workflow file is renamed or recreated, and this file has been renamed
          # before — so those tags collided with releases from the previous cycle
          # and a build quietly attached its IPA to a month-old release that still
          # held a stale asset. The date plus the run number is unique across
          # renames, and sorts sensibly.
          tag_name: xforge-${{ github.run_number }}-${{ github.run_id }}
          name: XForge ${{ env.EXPECTED_VERSION }} — unsigned IPA
          # The exact file, not `dist/XForge-*-unsigned.ipa`: the glob matches
          # whatever happens to be in dist/, which is how a stale second IPA
          # survived in a release.
          files: dist/XForge-${{ env.EXPECTED_VERSION }}-unsigned.ipa
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          generate_release_notes: false
          fail_on_unmatched_files: true
