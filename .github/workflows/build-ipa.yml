name: Build XForge IPA

# Builds the unsigned XForge IPA.
#
# There is no rootfs-provisioning job here. The Alpine root — including the build
# toolchain, when the published root carries one — is built once by the `rootfs`
# workflow, published as a pinned release asset and downloaded here; see
# EmbeddedLinux/build-rootfs.sh. Provisioning a Swift toolchain into every CI run
# is what used to make this job slow and its artifact enormous. What arrives now
# is a fakefs ZIP the app only unzips: a guest that can build an iOS app on first
# launch, with nothing to install on the device.
#
# The engine (OpenMinis/ish-arm64) is built here, on macOS, because it can only
# be: the aarch64 gadget sources alias registers with `.req` and only clang's
# integrated assembler accepts that, so a GNU binutils toolchain cannot assemble
# them at all. `EmbeddedLinux/build-ish-core.sh` probes for the capability and
# fails with an explanation rather than a wall of assembler errors.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Publish the IPA as a GitHub release
        type: boolean
        default: true
      run_tests:
        description: Run simulator unit tests before archiving
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  ipa:
    name: Build the IPA
    runs-on: macos-15
    timeout-minutes: 120
    # Serialized, never cancelled. Each run publishes its own
    # `xforge-<run_number>` tag, so a queued run is not lost — it just waits.
    concurrency:
      group: xforge-ipa
      cancel-in-progress: false
    env:
      APP_PATH: build/XForge.xcarchive/Products/Applications/XForge.app
      DERIVED_DATA_PATH: build/DerivedData
      ENGINE_ROOT: Vendor/ish-arm64
      ENGINE_LIB_DIR: Vendor/ish-arm64-build/lib
      # Must match XFORGE_MARKETING_VERSION in project.yml; asserted below so a
      # version bump cannot silently produce a mislabelled release.
      EXPECTED_VERSION: "0.5.0"
      # The pinned rootfs. Changing this tag is how the bundled Alpine root is
      # upgraded; `make rootfs` (or the `rootfs` workflow) builds and publishes
      # a new one. The sha256 is asserted below, so a tag that is moved — or an
      # upload that was truncated — fails the build instead of shipping silently.
      #
      # rootfs-v5 is the *provisioned* root: plain Alpine plus xtool, swiftly, the
      # Swift toolchain and the Darwin SDK, so the guest can build without first
      # installing anything. Its manifest says how it was built, and the checks
      # below hold it to that.
      ROOTFS_TAG: rootfs-v5
      ROOTFS_ASSET: alpine-rootfs.zip
      SPM_CLONES_DIR: .spm
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Download the pinned Alpine rootfs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The same script any other build calls (and that Xcode users run by
          # hand): it reads the pinned tag from this file, downloads the asset,
          # verifies the published sha256 and checks it is a fakefs ZIP.
          bash EmbeddedLinux/fetch-rootfs.sh

      - name: Verify the downloaded rootfs
        run: |
          set -euo pipefail
          cd Support/Resources
          # Read the checksum file and verify, rather than piping a listing into
          # grep: `producer | grep -q` closes the pipe early, the producer dies
          # of SIGPIPE, and under `set -o pipefail` a check that passed then
          # reports failure.
          shasum -a 256 -c "$ROOTFS_ASSET.sha256"

          unzip -Z1 "$ROOTFS_ASSET" > /tmp/rootfs-entries.txt
          grep -q '^alpine-rootfs/meta\.db$' /tmp/rootfs-entries.txt \
            || { echo '::error::the rootfs archive has no meta.db'; exit 1; }
          grep -q '^alpine-rootfs/data/$' /tmp/rootfs-entries.txt \
            || { echo '::error::the rootfs archive has no data/ directory'; exit 1; }
          grep -q '^alpine-rootfs/data/bin/sh$' /tmp/rootfs-entries.txt \
            || { echo '::error::the rootfs archive has no /bin/sh'; exit 1; }
          # SQLite sidecars are transient; the builder excludes them, and a
          # regression there would put a stale WAL into every install.
          ! grep -qE '\.db-(wal|shm)$' /tmp/rootfs-entries.txt

          # The glibc compatibility layer must be in the root *and indexed in
          # meta.db*: it is installed before the fakefs conversion precisely so
          # the engine can resolve it. Checking the ZIP listing alone would pass
          # for a root where the files exist on disk but the database has no rows
          # for them, which the guest reads as "not there at all".
          grep -q '^alpine-rootfs/data/opt/glibc/usr/lib/aarch64-linux-gnu/ld-linux-aarch64\.so\.1$' \
            /tmp/rootfs-entries.txt \
            || { echo '::error::the rootfs has no glibc layer'; exit 1; }
          grep -q '^alpine-rootfs/data/usr/local/share/xforge/glibc\.env$' \
            /tmp/rootfs-entries.txt \
            || { echo '::error::the rootfs has no glibc.env marker'; exit 1; }
          unzip -p "$ROOTFS_ASSET" alpine-rootfs/meta.db > /tmp/rootfs-meta.db
          indexed="$(sqlite3 /tmp/rootfs-meta.db \
            "SELECT COUNT(*) FROM paths WHERE CAST(path AS TEXT) LIKE '%aarch64-linux-gnu%';")"
          [ "${indexed:-0}" -gt 0 ] \
            || { echo "::error::the glibc layer is not indexed in meta.db ($indexed paths)"; exit 1; }
          echo "glibc layers paths indexed: $indexed"

          # The guest boots /sbin/init, which reads /etc/inittab and respawns
          # /sbin/xforge-login root on the console — the script that starts root's
          # login shell in /etc/passwd. That is the whole Terminal tab, and the
          # shell it names is part of the root's contract, so both are checked
          # here: a root pinned to a tag that predates them fails the build
          # instead of shipping a terminal that cannot start a shell.
          unzip -p "$ROOTFS_ASSET" alpine-rootfs/data/etc/inittab > /tmp/rootfs-inittab.txt
          grep -qE '^tty1::respawn:/sbin/xforge-login root$' /tmp/rootfs-inittab.txt \
            || { echo '::error::the rootfs does not respawn xforge-login on the console'; exit 1; }
          unzip -p "$ROOTFS_ASSET" alpine-rootfs/data/usr/local/share/xforge/rootfs-manifest.txt \
            > /tmp/rootfs-manifest.txt
          ROOTFS_SHELL="$(awk '/^[[:space:]]*shell:/ { print $2 }' /tmp/rootfs-manifest.txt)"
          [ -n "$ROOTFS_SHELL" ] \
            || { echo '::error::the rootfs manifest does not name a login shell'; exit 1; }
          unzip -Z1 "$ROOTFS_ASSET" > /tmp/rootfs-files.txt
          for path in \
            alpine-rootfs/data/sbin/init \
            alpine-rootfs/data/bin/login \
            alpine-rootfs/data/etc/inittab \
            alpine-rootfs/data/etc/init.d/rcS \
            alpine-rootfs/data/sbin/xforge-login \
            "alpine-rootfs/data${ROOTFS_SHELL}" \
            alpine-rootfs/data/usr/share/terminfo/x/xterm-256color ; do
            grep -qx "$path" /tmp/rootfs-files.txt \
              || { echo "::error::the rootfs has no ${path#alpine-rootfs/data}"; exit 1; }
          done
          echo "console: /sbin/xforge-login root → $ROOTFS_SHELL"

          # The root's own manifest also says whether the build toolchain is baked
          # in, and this is the other half of what the root is for: a guest that
          # can build an iOS app without installing anything first. The checks are
          # held to the manifest's claim, so the *plain* root still passes and a
          # provisioned root that lost its toolchain does not — and the SDK is
          # checked through meta.db as well as the listing, because a file the
          # engine cannot see is a file the guest does not have.
          TOOLCHAIN_CLAIM="$(awk '/^[[:space:]]*toolchain:/ { sub(/^[[:space:]]*toolchain:[[:space:]]*/, ""); print; exit }' /tmp/rootfs-manifest.txt)"
          echo "toolchain: ${TOOLCHAIN_CLAIM:-<none stated>}"
          case "$TOOLCHAIN_CLAIM" in
            ""|"not provisioned"*)
              echo "::error::the pinned rootfs ($ROOTFS_TAG) ships no build toolchain —
          the guest would have to install Swift and xtool itself on the device. Bump
          ROOTFS_TAG to a provisioned root, or say so deliberately here."
              exit 1
              ;;
            *)
              for path in \
                alpine-rootfs/data/usr/local/bin/xtool \
                alpine-rootfs/data/usr/local/bin/swift \
                alpine-rootfs/data/usr/local/bin/swiftc \
                alpine-rootfs/data/usr/local/bin/swiftly \
                alpine-rootfs/data/opt/xtool/usr/bin/xtool ; do
                grep -qx "$path" /tmp/rootfs-entries.txt \
                  || { echo "::error::the rootfs claims a toolchain but has no ${path#alpine-rootfs/data}"; exit 1; }
              done
              grep -qE '^alpine-rootfs/data/root/\.local/share/swiftly/toolchains/[^/]+/usr/bin/swift-frontend$' \
                /tmp/rootfs-entries.txt \
                || { echo '::error::the rootfs has no Swift toolchain'; exit 1; }
              grep -qE '^alpine-rootfs/data/root/\.local/share/swiftly/toolchains/[^/]+/usr/lib/swift/linux/[^/]+/Swift\.swiftmodule$' \
                /tmp/rootfs-entries.txt \
                || { echo '::error::the Swift toolchain has no Linux stdlib'; exit 1; }

              SDK_PATH="$(awk '/^[[:space:]]*darwin-sdk-path:/ { print $2; exit }' /tmp/rootfs-manifest.txt)"
              [ -n "$SDK_PATH" ] \
                || { echo '::error::the rootfs claims a toolchain but names no Darwin SDK path'; exit 1; }
              grep -qx "alpine-rootfs/data${SDK_PATH}/info.json" /tmp/rootfs-entries.txt \
                || { echo "::error::the rootfs has no Darwin SDK at $SDK_PATH"; exit 1; }
              sdk_indexed="$(sqlite3 /tmp/rootfs-meta.db \
                "SELECT COUNT(*) FROM paths WHERE CAST(path AS TEXT) LIKE '${SDK_PATH%/}/%';")"
              [ "${sdk_indexed:-0}" -gt 0 ] \
                || { echo "::error::the Darwin SDK is in the zip but not indexed in meta.db ($sdk_indexed paths)"; exit 1; }
              echo "toolchain: xtool, swift, and the Darwin SDK at $SDK_PATH ($sdk_indexed indexed paths)"
              ;;
          esac

          echo "rootfs: $(du -h "$ROOTFS_ASSET" | cut -f1), $(wc -l < /tmp/rootfs-entries.txt) entries"

      - name: Check out the embedded Linux engine
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 "$ENGINE_ROOT"
          # The engine's own submodules are deliberately skipped: deps/libarchive
          # and deps/libapps feed tools this app does not link, and deps/linux is
          # only used with -Dkernel=linux, which XForge does not build.
          git -C "$ENGINE_ROOT" log --oneline -1

      - name: Install the build tools
        run: |
          set -euo pipefail
          # xcodegen generates the Xcode project from project.yml; meson/ninja
          # build the engine. libarchive is not needed at all: the app unpacks the
          # fakefs ZIP with ZIPFoundation instead of importing an archive.
          # llvm/lld provide the aarch64-linux cross-compiler the guest VDSO
          # needs (`clang -target aarch64-linux-gnu -fuse-ld=lld`) — Apple's
          # clang cannot link that. shellcheck validates the pinned zsign
          # installer, hence it is installed with the build tools.
          required=(xcodegen meson ninja llvm lld shellcheck)
          missing=()
          for formula in "${required[@]}"; do
            if ! brew list --versions "$formula" >/dev/null 2>&1; then
              missing+=("$formula")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            brew install "${missing[@]}"
          else
            echo "Homebrew tools already installed"
          fi

      - name: Identify engine cache inputs
        id: engine-revision
        run: echo "value=$(git -C "$ENGINE_ROOT" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Identify the iOS compiler toolchain
        id: toolchain-versions
        run: |
          {
            echo "value=$(xcodebuild -version | tr '\n' ' ')-$(clang --version | head -n 1)-$(meson --version)"
          } >> "$GITHUB_OUTPUT"

      - name: Cache the embedded Linux engine
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ENGINE_LIB_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-engine-${{ hashFiles('.gitmodules', 'EmbeddedLinux/build-ish-core.sh', 'project.yml') }}-${{ steps.engine-revision.outputs.value }}-${{ steps.toolchain-versions.outputs.value }}

      - name: Build the embedded Linux engine (ish-arm64, iOS arm64)
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          bash EmbeddedLinux/build-ish-core.sh
          # Prove the engine is really there before spending 20 minutes on an
          # archive that would fail to link.
          for lib in libish.a libish_emu.a libfakefs.a; do
            test -f "$ENGINE_LIB_DIR/$lib" \
              || { echo "::error::the engine build did not produce $lib"; exit 1; }
          done
          # The arm64 backend must be the one that was built: app and engine
          # share struct layouts, so the wrong guest arch links but misbehaves.
          nm -gU "$ENGINE_LIB_DIR/libish_emu.a" > /tmp/engine-symbols.txt 2>/dev/null || true
          if grep -qi 'guest_arm64\|gadget' /tmp/engine-symbols.txt; then
            echo "arm64 gadget backend present in libish_emu.a"
          else
            echo "::error::libish_emu.a has no arm64 gadget symbols — wrong guest_arch?"
            exit 1
          fi

      - name: Validate the bundled guest tools
        run: |
          set -euo pipefail
          # zsign is built inside Alpine on first use. These two files are the
          # guest-side installer and the tiny patch that adds -Q/--password-file
          # to the pinned upstream CLI (so a P12 password never appears in argv).
          bash -n EmbeddedLinux/install-zsign.sh
          shellcheck -S error EmbeddedLinux/install-zsign.sh
          python3 -m py_compile EmbeddedLinux/patch-zsign-password-file.py
          rm -rf EmbeddedLinux/__pycache__
          grep -q '^ZSIGN_COMMIT=614caa8d1ca949e260e5746144aa52d27a4b08d6$' \
            EmbeddedLinux/install-zsign.sh
          grep -q '^ZSIGN_SHA256=a373dc5ddbf81ba5c435a48c14b4a2857506c3dde02ec62e0136b6968797384b$' \
            EmbeddedLinux/install-zsign.sh
          grep -q 'install-zsign.sh' project.yml
          grep -q 'patch-zsign-password-file.py' project.yml

      - name: Generate the Xcode project
        run: xcodegen generate --spec project.yml

      - name: Cache Swift package clones
        uses: actions/cache@v4
        with:
          path: .spm
          key: ${{ runner.os }}-spm-${{ hashFiles('project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Swift package dependencies
        run: |
          set -o pipefail
          xcodebuild -project XForge.xcodeproj -scheme XForge \
            -resolvePackageDependencies \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath "$SPM_CLONES_DIR" \
            -derivedDataPath "$DERIVED_DATA_PATH" 2>&1 | tee /tmp/resolve.log

      - name: Run the unit tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_tests }}
        run: |
          set -o pipefail
          xcodebuild -project XForge.xcodeproj -scheme XForge \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -clonedSourcePackagesDirPath "$SPM_CLONES_DIR" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            test 2>&1 | tee /tmp/tests.log

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          rm -rf build/XForge.xcarchive
          xcodebuild -project XForge.xcodeproj -scheme XForge \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath "$SPM_CLONES_DIR" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            archive -archivePath build/XForge.xcarchive 2>&1 | tee /tmp/build.log

      - name: Verify the built app
        run: |
          set -euo pipefail
          test -d "$APP_PATH"
          test -x "$APP_PATH/XForge"

          # Architecture, from the binary itself rather than from the build log.
          binary_info="$(lipo -info "$APP_PATH/XForge")"
          case "$binary_info" in
            *arm64*) ;;
            *) echo "::error::the app binary is not arm64: $binary_info"; exit 1 ;;
          esac
          # NOTE: do not try to prove the engine is linked by scanning the app
          # binary for its symbols. Xcode's Release configuration strips, and on
          # a stripped binary `nm` reports "no symbols" and finds nothing — so a
          # symbol check fails for a perfectly good build. The engine's presence
          # is proven where it can be observed instead: the engine libraries are
          # asserted after they are built, and the guest is exercised by the
          # smoke harness. What is worth checking here is that the app is
          # self-consistent — the rootfs it needs is inside it.
          size_mb=$(( $(stat -f%z "$APP_PATH/XForge") / 1048576 ))
          echo "app binary: ${binary_info#*: } (${size_mb} MB)"
          test "$size_mb" -gt 1 \
            || { echo '::error::the app binary is implausibly small'; exit 1; }

          # The rootfs must be inside the app, and must be the fakefs ZIP the app
          # knows how to unpack.
          ROOTFS="$APP_PATH/alpine-rootfs.zip"
          test -f "$ROOTFS" \
            || { echo '::error::the app does not bundle alpine-rootfs.zip'; exit 1; }
          unzip -Z1 "$ROOTFS" > /tmp/bundled-rootfs.txt
          grep -q '^alpine-rootfs/meta\.db$' /tmp/bundled-rootfs.txt \
            || { echo '::error::the bundled rootfs has no meta.db'; exit 1; }
          grep -q '^alpine-rootfs/data/bin/sh$' /tmp/bundled-rootfs.txt \
            || { echo '::error::the bundled rootfs has no /bin/sh'; exit 1; }

          # No engine build leftovers in the bundle.
          strays="$(find "$APP_PATH" \( -name '*.a' -o -name 'meson-*' -o -name 'build.ninja' \) -print -quit)"
          [ -z "$strays" ] \
            || { echo "::error::build leftovers in the app bundle: $strays"; exit 1; }

          # Exactly one rootfs, and it is the one the app reads. This is a real
          # regression: the app used to bundle a tarball it imported at runtime,
          # that file stayed committed after the switch to a fakefs ZIP, and the
          # IPA shipped both — 4 MB of dead weight nothing ever opened.
          rootfs_files="$(find "$APP_PATH" -maxdepth 1 \
            \( -name '*.tar.gz' -o -name '*.tar.xz' -o -name 'alpine-rootfs*.zip' \) -print)"
          count="$(printf '%s\n' "$rootfs_files" | grep -c . || true)"
          [ "$count" = "1" ] || {
            echo "::error::expected exactly one rootfs in the bundle, found $count:"
            printf '  %s\n' $rootfs_files
            exit 1
          }
          case "$rootfs_files" in
            */alpine-rootfs.zip) ;;
            *) echo "::error::the bundled rootfs is not alpine-rootfs.zip: $rootfs_files"; exit 1 ;;
          esac

          # Identity and the icon wiring that makes the app installable.
          PLIST="$APP_PATH/Info.plist"
          test -f "$PLIST"
          test -f "$APP_PATH/Assets.car"
          get() { /usr/libexec/PlistBuddy -c "Print :$1" "$PLIST"; }
          test "$(get CFBundleShortVersionString)" = "${{ env.EXPECTED_VERSION }}"
          test "$(get CFBundleIdentifier)" = "com.r0gueee.xforge"
          test "$(get CFBundleDisplayName)" = "XForge"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon" "$PLIST" >/dev/null

          python3 - <<'PY'
          import plistlib
          required = {
              "get-task-allow",
              "application-identifier",
              "com.apple.developer.kernel.extended-virtual-addressing",
              "com.apple.developer.kernel.increased-memory-limit",
          }
          with open("Support/XForge.entitlements", "rb") as handle:
              entitlements = plistlib.load(handle)
          missing = required - entitlements.keys()
          assert not missing, f"missing entitlements: {sorted(missing)}"
          PY
          settings="$(xcodebuild -project XForge.xcodeproj -scheme XForge \
            -destination 'generic/platform=iOS' -showBuildSettings 2>/dev/null)"
          case "$settings" in
            *XForge.entitlements*) ;;
            *) echo '::error::CODE_SIGN_ENTITLEMENTS is not wired'; exit 1 ;;
          esac

          {
            echo '### Built app'
            echo
            echo "- binary: ${binary_info#*: } (${size_mb} MB)"
            echo "- bundled rootfs: $ROOTFS_TAG ($(du -h "$ROOTFS" | cut -f1))"
            echo "- guest toolchain: $(unzip -p "$ROOTFS" alpine-rootfs/usr/local/share/xforge/rootfs-manifest.txt \
              | awk '/^[[:space:]]*toolchain:/ { sub(/^[[:space:]]*toolchain:[[:space:]]*/, ""); print; exit }')"
            echo "- version: $(get CFBundleShortVersionString)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package the unsigned IPA
        run: |
          set -euo pipefail
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")"
          IPA="dist/XForge-$VERSION-unsigned.ipa"
          # Start from an empty dist/. A leftover IPA here would be uploaded
          # alongside the new one (they have different names, so `--clobber`
          # would not replace it), and a release offering two builds of different
          # versions is worse than one that offers none.
          rm -rf dist
          mkdir -p dist/Payload
          ditto "$APP_PATH" dist/Payload/XForge.app
          ditto -c -k --keepParent dist/Payload "$IPA"
          unzip -t "$IPA" >/dev/null

          # The rootfs is the difference between an app that works on first
          # launch and one that has nothing to boot.
          unzip -Z1 "$IPA" > /tmp/ipa-contents.txt
          grep -q 'Payload/XForge.app/alpine-rootfs\.zip$' /tmp/ipa-contents.txt \
            || { echo '::error::the IPA does not contain the rootfs'; exit 1; }

          # Exactly one IPA, and it is the version the app says it is.
          count="$(find dist -maxdepth 1 -name '*.ipa' | wc -l | tr -d ' ')"
          [ "$count" = "1" ] \
            || { echo "::error::expected exactly one IPA in dist/, found $count:"; ls -la dist; exit 1; }
          test -f "$IPA" || { echo "::error::$IPA was not produced"; exit 1; }

          echo "IPA: $IPA ($(du -h "$IPA" | cut -f1))"
          # A provisioned root makes this a ~1.6 GB IPA, and GitHub refuses a
          # release asset over 2 GiB. Failing here — with the number — is better
          # than a publish step that errors out after the whole build.
          ipa_bytes="$(stat -f%z "$IPA")"
          if [ "$ipa_bytes" -gt 1900000000 ]; then
            echo "::error::the IPA is $((ipa_bytes / 1048576)) MB; GitHub refuses a release asset over 2 GiB"
            exit 1
          fi
          echo "ipa=$IPA" >> "$GITHUB_ENV"

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: XForge-unsigned-ipa
          path: dist/XForge-${{ env.EXPECTED_VERSION }}-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish the release
        if: ${{ github.event_name == 'push' || inputs.release }}
        uses: softprops/action-gh-release@v2
        with:
          # Not `xforge-<run_number>`. `run_number` restarts at 1 whenever a
          # workflow file is renamed or recreated, and this file has been renamed
          # before — so those tags collided with releases from the previous cycle
          # and a build quietly attached its IPA to a month-old release that still
          # held a stale asset. The date plus the run number is unique across
          # renames, and sorts sensibly.
          tag_name: xforge-${{ github.run_number }}-${{ github.run_id }}
          name: XForge ${{ env.EXPECTED_VERSION }} — unsigned IPA
          # The exact file, not `dist/XForge-*-unsigned.ipa`: the glob matches
          # whatever happens to be in dist/, which is how a stale second IPA
          # survived in a release.
          files: dist/XForge-${{ env.EXPECTED_VERSION }}-unsigned.ipa
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          generate_release_notes: false
          fail_on_unmatched_files: true
