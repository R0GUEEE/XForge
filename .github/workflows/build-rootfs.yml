name: Publish the Alpine rootfs

# Builds the Alpine root filesystem that XForge bundles, and publishes it as a
# pinned release asset for `build-ipa.yml` to download.
#
# Run this by hand when the root changes (a new Alpine release, a change to the
# root's configuration, a new Swift or xtool release). It is deliberately NOT part
# of the IPA build: rebuilding the root on every IPA run is what used to make that
# job slow, and the root changes far less often than the app.
#
# What goes in it is `provision`:
#
#   all   (default) plain Alpine *plus the build toolchain* — xtool, swiftly, the
#         Swift toolchain and the Darwin Swift SDK — installed in a chroot of the
#         root being built, so the guest boots ready to build an iOS app. ~1.6 GB.
#   none  plain Alpine only; the guest installs the toolchain itself on demand.
#
# The output is a ZIP of an *already-converted* fakefs — a `data/` tree plus a
# `meta.db` — produced by the engine's own tools/fakefsify. The app only unzips
# it, so first launch costs an unzip rather than a multi-minute import.
#
# Builds on Linux rather than macOS on purpose: the conversion tool must run on
# the build machine (it is not cross-compiled), and provisioning runs the guest's
# own tools (arm64 Linux binaries) — both need an aarch64 Linux host, which the
# arm64 runner is natively.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish under (e.g. rootfs-v5)
        type: string
        required: true
      alpine_version:
        description: Alpine release series
        type: string
        default: "3.21"
      provision:
        description: Bake the build toolchain (xtool, Swift, Darwin SDK) into the root
        type: choice
        options:
          - all
          - none
        default: all
      provision_sdk:
        description: Include the Darwin Swift SDK (~400 MB download, ~1.3 GB installed)
        type: boolean
        default: true
      darwin_sdk_tag:
        description: Release the Darwin Swift SDK comes from
        type: string
        default: darwin-sdk-7
      default_shell:
        description: Login shell root's console starts (must be installed by console_packages)
        type: string
        default: "/bin/bash"
      console_packages:
        description: Space-separated packages baked in for the console session
        type: string
        default: "bash coreutils less ncurses-terminfo"

permissions:
  contents: write

jobs:
  rootfs:
    name: Build and publish the rootfs
    runs-on: ubuntu-24.04-arm
    # Provisioning downloads the Swift toolchain, unpacks the Darwin SDK and
    # installs both inside a chroot, then converts ~5 GB of filesystem to fakefs.
    # The unprovisioned root takes a couple of minutes; this takes the rest.
    timeout-minutes: 240
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Make sure there is room for a provisioned root
        if: inputs.provision == 'all'
        run: |
          set -euo pipefail
          # A provisioned root is ~5 GB on disk before it is packed, and the
          # conversion used to want another 11 GB: the tree, the tar of it, and
          # the fakefs root it converts to. The builder no longer holds the tree
          # and the fakefs root at the same time (the tree is deleted once it is
          # packed), which brings the peak to ~7 GB — but it is worth both saying
          # so and taking back the ~2 GB of preinstalled SDKs a runner has and
          # this job does not use.
          df -h /
          sudo apt-get clean || true
          for dir in /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/lib/jvm \
                     /usr/local/lib/android /opt/hostedtoolcache; do
            sudo rm -rf "$dir" || true
          done
          df -h /

      - name: Check out the engine (for tools/fakefsify)
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 Vendor/ish-arm64
          # fakefsify links libarchive, so its submodule is required too.
          git -C Vendor/ish-arm64 submodule update --init --depth 1 deps/libarchive

      - name: Install the build tools
        run: |
          set -euo pipefail
          # meson/ninja build fakefsify; libarchive-dev is what it links
          # against (the engine's meson looks for it via pkg-config); zip packs
          # the result; shellcheck guards the builder scripts; sqlite3 reads the
          # meta.db of the packed root, which is where the published root's paths
          # and modes are actually checked.
          sudo apt-get update -qq
          sudo apt-get install -y -qq meson ninja-build libarchive-dev zip unzip shellcheck sqlite3

      - name: Check the rootfs builder
        run: |
          set -euo pipefail
          bash -n EmbeddedLinux/build-rootfs.sh
          bash -n EmbeddedLinux/verify-rootfs.sh
          shellcheck -S error EmbeddedLinux/build-rootfs.sh EmbeddedLinux/verify-rootfs.sh
          # The console program is /bin/sh (busybox ash), and it is installed into
          # the guest rather than run here — parse it and lint it, but as POSIX sh,
          # which is the dialect it is written in. install-toolchain.sh is in the
          # same dialect: it is the guest's own installer, and this build runs it
          # in a chroot of the root being built.
          sh -n EmbeddedLinux/xforge-login
          shellcheck -s sh -S error EmbeddedLinux/xforge-login
          sh -n EmbeddedLinux/install-toolchain.sh
          shellcheck -s sh -S error EmbeddedLinux/install-toolchain.sh
          # The toolchain half of the verification: a packed fakefs root cannot be
          # chrooted and run, so "the toolchain is really in the artifact" is a
          # structural check — and a structural check that looks for the wrong
          # path, or that believes the manifest, passes everything. This drives
          # verify-rootfs.sh against roots that are complete except for one thing
          # and asserts it fails, naming that thing.
          bash -n Tools/test-verify-toolchain.sh
          shellcheck -S error Tools/test-verify-toolchain.sh
          bash Tools/test-verify-toolchain.sh

      - name: Build the rootfs
        env:
          XFORGE_ALPINE_VERSION: ${{ inputs.alpine_version }}
          XFORGE_PROVISION: ${{ inputs.provision }}
          XFORGE_PROVISION_SDK: ${{ inputs.provision_sdk && '1' || '0' }}
          XFORGE_DARWIN_SDK_TAG: ${{ inputs.darwin_sdk_tag }}
          XFORGE_DEFAULT_SHELL: ${{ inputs.default_shell }}
          XFORGE_CONSOLE_PACKAGES: ${{ inputs.console_packages }}
        run: |
          set -euo pipefail
          # As root: the guest's installer and apk run in a chroot of the tree
          # being built (installing the glibc layer unpacks Ubuntu packages with
          # ar/zstd and writes to /lib, /usr/lib and /opt/glibc; provisioning runs
          # install-toolchain.sh itself), and a chroot needs mounts. Keep the work
          # directory and the output separate so the resulting files are owned by
          # the runner, not root.
          sudo -E env "PATH=$PATH" \
            XFORGE_ALPINE_VERSION="$XFORGE_ALPINE_VERSION" \
            XFORGE_PROVISION="$XFORGE_PROVISION" \
            XFORGE_PROVISION_SDK="$XFORGE_PROVISION_SDK" \
            XFORGE_DARWIN_SDK_TAG="$XFORGE_DARWIN_SDK_TAG" \
            XFORGE_DEFAULT_SHELL="$XFORGE_DEFAULT_SHELL" \
            XFORGE_CONSOLE_PACKAGES="$XFORGE_CONSOLE_PACKAGES" \
            bash EmbeddedLinux/build-rootfs.sh "$PWD/dist/rootfs"
          sudo chown -R "$(id -u):$(id -g)" dist
          ls -la dist/rootfs

      - name: Verify the root boots what XForge expects
        run: |
          set -euo pipefail
          # XForge boots pid 1 as /sbin/init and drives the guest's single console,
          # where /etc/inittab respawns /sbin/xforge-login root — the script that
          # execs root's login shell from /etc/passwd. A root that cannot do that
          # has no usable Terminal, and nothing else would notice: it fails here
          # rather than on a device, and on the *published artifact*, not on the
          # tree it was made from.
          #
          # For a provisioned root the same run also checks the toolchain the
          # manifest claims: xtool, a Swift toolchain with a stdlib, and the Darwin
          # SDK at the path it recorded — including that the engine can *see* the
          # SDK, i.e. that it is indexed in meta.db. A fakefs root cannot be
          # chrooted, so those checks are structural; the "it compiles" check ran
          # on the tree during the build, where install-toolchain.sh verify could
          # run a real compilation.
          #
          # The checker unpacks the ZIP and runs the guest's own console program in
          # a chroot, so "root's shell starts" is answered by the root itself.
          # Needs root for the chroot (the runner is aarch64, same as the root).
          sudo -E env "PATH=$PATH" \
            bash EmbeddedLinux/verify-rootfs.sh "$PWD/dist/rootfs/alpine-rootfs.zip"

      - name: Report the artifact
        run: |
          set -euo pipefail
          ZIP=dist/rootfs/alpine-rootfs.zip
          SIZE="$(stat -c %s "$ZIP")"
          # GitHub refuses a release asset over 2 GiB, and the IPA that carries
          # this root is a few MB larger than the root itself. A provisioned root
          # is ~1.6 GB, so the margin exists — but it is not large, and finding out
          # at the upload is worse than finding out here.
          if [ "$SIZE" -gt 1900000000 ]; then
            echo "::error::$ZIP is $((SIZE / 1048576)) MB; an IPA bundling it would not fit in a 2 GiB release asset"
            exit 1
          fi
          # `data/` because the archive is a fakefs: its tree is under
          # alpine-rootfs/data/, and the manifest is a file in that tree.
          unzip -p "$ZIP" alpine-rootfs/data/usr/local/share/xforge/rootfs-manifest.txt \
            > /tmp/rootfs-manifest.txt
          {
            echo "### Rootfs: $((SIZE / 1048576)) MB"
            echo
            echo '```'
            cat /tmp/rootfs-manifest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          # Create the release if it is new; uploading with --clobber makes a
          # re-run of the same tag replace the assets rather than fail.
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "XForge Alpine rootfs (${{ inputs.alpine_version }})" \
              --notes "Alpine aarch64 fakefs for the XForge embedded Linux engine, built by EmbeddedLinux/build-rootfs.sh. Tools: ${{ inputs.provision == 'all' && format('xtool, swiftly, Swift{0}', inputs.provision_sdk && format(' and the {0} Darwin SDK', inputs.darwin_sdk_tag) || '') || 'plain Alpine only (the guest provisions itself)' }}. Pinned by build-ipa.yml via ROOTFS_TAG."

          gh release upload "$TAG" \
            --repo "${{ github.repository }}" \
            dist/rootfs/alpine-rootfs.zip \
            dist/rootfs/alpine-rootfs.zip.sha256 \
            --clobber

      - name: Summary
        run: |
          set -euo pipefail
          {
            echo "### Published \`${{ inputs.tag }}\`"
            echo
            echo "- asset: \`alpine-rootfs.zip\`"
            echo "- size: $(du -h dist/rootfs/alpine-rootfs.zip | cut -f1)"
            echo "- toolchain: ${{ inputs.provision == 'all' && 'provisioned' || 'none' }}"
            echo "- darwin SDK: ${{ inputs.provision == 'all' && inputs.provision_sdk && inputs.darwin_sdk_tag || 'not included' }}"
            echo "- sha256: $(cut -d' ' -f1 < dist/rootfs/alpine-rootfs.zip.sha256)"
            echo
            echo "Set \`ROOTFS_TAG\` in .github/workflows/build-ipa.yml to this tag."
          } >> "$GITHUB_STEP_SUMMARY"
