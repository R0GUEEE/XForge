name: Native iOS Toolchain

# Builds the compiler that XForge links into the app: Clang + Mach-O LLD for
# iPhoneOS, and — when `with_swift` is set — Swift's frontend libraries.
#
# Two things about the Swift half are worth knowing before editing it:
#
#  * Every bundle is built from Swift's LLVM fork (`swiftlang/llvm-project` at the
#    branch paired with the Swift version), never from upstream. Swift is developed
#    against that fork (the `swiftasync` calling convention, the coroutine passes,
#    the C++ API it compiles against), and — the part that decided it — upstream's
#    clang is a different *API generation*: value-typed `DiagnosticOptions` and
#    reference-taking constructors, against the fork's reference-counted options and
#    pointer-taking ones. The app's C bridge is compiled against whichever bundle is
#    installed, so it can only be written for one generation. Pinning the fork for
#    both bundles is also what removes the old "unpinned checkout of llvm-project
#    main" this workflow used to have.
#  * `-DSWIFT_INSTALL_COMPONENTS=` is load-bearing. Swift's CMake writes that as a
#    *cache* variable, so an empty value on the command line survives its default
#    and no component is ever installed — which means `swift_install_in_component`
#    returns early and its `install(TARGETS ...)` never runs. That rule is what
#    aborts the configure when Swift is cross-configured for iOS: CMake refuses
#    `install(TARGETS)` for an executable without a BUNDLE destination on an iOS
#    target, and Swift's host tools have no such destination.
#
# The Swift version must match the Swift runtime inside the darwin SDK the app
# compiles against (that SDK is built from an Xcode; Xcode 26.6 ships Swift
# 6.2.4), otherwise the frontend cannot read the SDK's standard-library modules.

on:
  workflow_dispatch:
    inputs:
      with_swift:
        description: Build the Swift frontend libraries as well
        type: boolean
        default: false
      swift_ref:
        description: swiftlang/swift tag or branch
        type: string
        default: swift-6.2.4-RELEASE
      swift_llvm_ref:
        description: swiftlang/llvm-project branch paired with swift_ref
        type: string
        default: swift/release/6.2
      configure_only:
        description: Stop after configuring the Swift build (cheap iteration)
        type: boolean
        default: false
      deployment_target:
        description: Minimum iOS version
        type: string
        default: "17.0"
      cache_salt:
        description: Bump to discard the cached iOS builds
        type: string
        default: "1"
  pull_request:
    paths:
      - "App/NativeToolchain/**"
      - ".github/workflows/native-toolchain.yml"
  push:
    branches:
      - native-toolchain-poc
    paths:
      - "App/NativeToolchain/**"
      - ".github/workflows/native-toolchain.yml"

jobs:
  llvm-ios:
    runs-on: macos-15
    timeout-minutes: 350
    env:
      IOS_DEPLOYMENT_TARGET: ${{ inputs.deployment_target || '17.0' }}
      SWIFT_REF: ${{ inputs.swift_ref || 'swift-6.2.4-RELEASE' }}
      SWIFT_LLVM_REF: ${{ inputs.swift_llvm_ref || 'swift/release/6.2' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install cmake ninja

      # One LLVM for every bundle this workflow builds: Swift's fork, at the branch
      # paired with the Swift version. Upstream's clang is a *different API
      # generation* from the fork's (reference-counted options and pointer-taking
      # printers versus value options and references), and the C bridge that the app
      # compiles against the bundle can only be written for one of them — so the
      # bundle must always be the same generation. Pinning it also removes the
      # "unpinned checkout of llvm-project main" this workflow used to have.
      - name: Checkout LLVM
        uses: actions/checkout@v4
        with:
          repository: swiftlang/llvm-project
          ref: ${{ env.SWIFT_LLVM_REF }}
          path: llvm-project
          fetch-depth: 1

      - name: Checkout Swift
        if: ${{ inputs.with_swift }}
        uses: actions/checkout@v4
        with:
          repository: swiftlang/swift
          ref: ${{ env.SWIFT_REF }}
          path: swift
          fetch-depth: 1

      # Swift's configure step executes `cmark --version` and generates
      # documentation with it, so a native cmark has to exist before the
      # cross-configure runs.
      - name: Checkout cmark
        if: ${{ inputs.with_swift }}
        uses: actions/checkout@v4
        with:
          repository: swiftlang/swift-cmark
          ref: release/6.2
          path: swift-cmark
          fetch-depth: 1

      # Only needed to *find* the sources at configure time; the macro and ASTGen
      # libraries are switched off, because a macro plugin is a separate process
      # and iOS has no way to run one.
      - name: Checkout swift-syntax
        if: ${{ inputs.with_swift }}
        uses: actions/checkout@v4
        with:
          repository: swiftlang/swift-syntax
          ref: release/6.2
          path: swift-syntax
          fetch-depth: 1

      - name: Checkout swift-experimental-string-processing
        if: ${{ inputs.with_swift }}
        uses: actions/checkout@v4
        with:
          repository: swiftlang/swift-experimental-string-processing
          ref: release/6.2
          path: swift-experimental-string-processing
          fetch-depth: 1

      - name: Identify the iOS compiler toolchain
        id: toolchain-versions
        run: |
          {
            echo "value=$(xcodebuild -version | tr '\n' ' ')-$(xcrun --sdk iphoneos --show-sdk-version)"
          } >> "$GITHUB_OUTPUT"

      # The expensive half is LLVM's cross-build and (when enabled) Swift's. The
      # key deliberately does not include the workflow file: editing this file —
      # which is what iterating on it looks like — must not force a rebuild of a
      # compiler that did not change. `cache_salt` is the way to ask for one.
      - name: Restore the LLVM builds
        id: llvm-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            llvm-host-build
            llvm-build
            cmark-host-build
            cmark-ios-build
          key: ${{ runner.os }}-${{ runner.arch }}-llvm-${{ steps.toolchain-versions.outputs.value }}-${{ env.SWIFT_LLVM_REF }}-${{ env.IOS_DEPLOYMENT_TARGET }}-${{ inputs.cache_salt || '1' }}

      # Swift's own build is the longer half and is cached separately, because it
      # is saved *after* the LLVM half has been built and Swift's has too. Its key
      # deliberately ignores `cache_salt`: that salt exists to discard an LLVM tree
      # when the LLVM source changes, and the Swift tree is a function of the Swift
      # refs and the SDK alone — discarding it too would throw away the 45-minute
      # half for a change to the other one.
      - name: Restore the Swift build
        if: ${{ inputs.with_swift }}
        id: swift-cache
        uses: actions/cache/restore@v4
        with:
          path: swift-build
          key: ${{ runner.os }}-${{ runner.arch }}-swift-${{ env.SWIFT_REF }}-${{ env.SWIFT_LLVM_REF }}-${{ steps.toolchain-versions.outputs.value }}-${{ env.IOS_DEPLOYMENT_TARGET }}-1

      - name: Build host TableGen tools
        shell: bash
        run: |
          set -euxo pipefail
          if [ -x llvm-host-build/bin/llvm-tblgen ] && [ -x llvm-host-build/bin/clang-tblgen ]; then
            echo "host TableGen tools already cached"
            exit 0
          fi
          cmake -S llvm-project/llvm -B llvm-host-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang" \
            -DLLVM_TARGETS_TO_BUILD=AArch64 \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_CURL=OFF
          ninja -C llvm-host-build llvm-tblgen clang-tblgen

          # Swift's CMake resolves its native tools through LLVM_TOOLS_BINARY_DIR,
          # which for the iOS build is a directory with no tools in it
          # (LLVM_BUILD_TOOLS=OFF). Mirroring the host tools there means every
          # path it might take finds them.
          mkdir -p llvm-build/bin
          for tool in llvm-host-build/bin/*; do
            ln -sf "$PWD/$tool" "llvm-build/bin/$(basename "$tool")"
          done

      - name: Build native cmark
        if: ${{ inputs.with_swift }}
        shell: bash
        run: |
          set -euxo pipefail
          if [ -x cmark-host-build/src/cmark-gfm ]; then
            echo "native cmark already cached"
            exit 0
          fi
          cmake -S swift-cmark -B cmark-host-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMARK_TESTS=OFF
          cmake --build cmark-host-build --target cmark-gfm
          mkdir -p cmark-host-build/src
          ln -sf cmark-host-build/src/cmark-gfm cmark-host-build/src/cmark

      - name: Build cmark for iPhoneOS
        if: ${{ inputs.with_swift || github.event_name != 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euxo pipefail
          if [ -f cmark-ios-build/src/libcmark-gfm.a ]; then
            echo "iOS cmark already cached"
            exit 0
          fi
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          cmake -S swift-cmark -B cmark-ios-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMARK_TESTS=OFF \
            -DCMARK_SHARED=OFF \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            -DCMAKE_C_COMPILER_TARGET=arm64-apple-ios$IOS_DEPLOYMENT_TARGET \
            -DCMAKE_CXX_COMPILER_TARGET=arm64-apple-ios$IOS_DEPLOYMENT_TARGET
          # cmark-gfm-extensions is a separate archive and swift's Markup references
          # symbols from both.
          ninja -C cmark-ios-build cmark-gfm cmark-gfm-extensions
          find cmark-ios-build -name 'libcmark-gfm*.a'

      - name: Configure LLVM for iPhoneOS arm64
        shell: bash
        run: |
          set -euxo pipefail
          # CLANG_BUILD_TOOLS is ON on purpose, and nothing builds that target.
          # Swift's CMake assumes the unified build it is configured against has a
          # `clang` executable target — lib/Tooling/libSwiftScan/CMakeLists.txt
          # does `add_dependencies(libSwiftScan clang …)` — and generation fails
          # outright when the target does not exist ("The dependency target
          # \"clang\" of target \"libSwiftScan\" does not exist"), even though
          # neither target is ever built here. Defining it is cheaper than
          # disabling Swift's subdirectories one generation error at a time.
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          cmake -S llvm-project/llvm -B llvm-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_MACOSX_BUNDLE=OFF \
            -DCMAKE_OSX_SYSROOT="$SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            -DCMAKE_C_COMPILER_TARGET=arm64-apple-ios$IOS_DEPLOYMENT_TARGET \
            -DCMAKE_CXX_COMPILER_TARGET=arm64-apple-ios$IOS_DEPLOYMENT_TARGET \
            -DLLVM_HOST_TRIPLE=arm64-apple-ios$IOS_DEPLOYMENT_TARGET \
            -DLLVM_DEFAULT_TARGET_TRIPLE=arm64-apple-ios$IOS_DEPLOYMENT_TARGET \
            -DLLVM_NATIVE_TOOL_DIR="$PWD/llvm-host-build/bin" \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_TARGETS_TO_BUILD=AArch64 \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_TOOLS=ON \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_UTILS=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_CURL=OFF \
            -DLLVM_ENABLE_RTTI=ON \
            -DCLANG_INCLUDE_TESTS=OFF \
            -DCLANG_BUILD_TOOLS=ON \
            -DLLD_INCLUDE_TESTS=OFF \
            -DLLD_BUILD_TOOLS=OFF

      # A restored build tree looks *older* than the sources that were just checked
      # out, and ninja compares timestamps — so it would rebuild everything the
      # cache exists to save. Touching the outputs puts them ahead again. It has to
      # happen *after* CMake's configure, not before: configure rewrites generated
      # headers (llvm/Config/…), and a header newer than the outputs invalidates
      # every edge that includes it, which is nearly all of them. Sound either way,
      # because a change to any source ref changes the cache key.
      - name: Make the restored LLVM build newer than its inputs
        if: ${{ steps.llvm-cache.outputs.cache-hit == 'true' }}
        shell: bash
        run: |
          set -euxo pipefail
          for tree in llvm-host-build llvm-build cmark-host-build cmark-ios-build; do
            [ -d "$tree" ] && find "$tree" -exec touch -c {} + 2>/dev/null || true
          done

      - name: Build Clang and Mach-O LLD libraries
        if: ${{ !inputs.configure_only }}
        run: |
          set -euxo pipefail
          ninja -C llvm-build \
            clangCodeGen \
            clangFrontend \
            clangFrontendTool \
            clangDriver \
            clangSerialization \
            clangSema \
            clangParse \
            clangAST \
            clangLex \
            clangBasic \
            lldMachO \
            lldCommon

      # The step this workflow exists for. Everything above is shared with the
      # LLVM-only bundle; everything below only happens when Swift is asked for.
      # Saved here, before the step most likely to fail, and with `if: always()`:
      # a failed Swift configure must not cost another LLVM cross-build.
      - name: Save the LLVM builds
        if: ${{ always() && steps.llvm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.llvm-cache.outputs.cache-primary-key }}
          path: |
            llvm-host-build
            llvm-build
            cmark-host-build
            cmark-ios-build

      - name: Configure the Swift frontend for iPhoneOS
        if: ${{ inputs.with_swift }}
        shell: bash
        run: |
          set -euxo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          HOST_SWIFT_BIN="$(dirname "$(xcrun -f swiftc)")"

          # CMAKE_SYSTEM_NAME=Darwin, not iOS, and that is deliberate. Swift's own
          # iOS builds are configured exactly this way (build-script-impl passes
          # the sysroot and SWIFT_HOST_VARIANT_SDK and never sets the system
          # name), because its CMake branches on `CMAKE_SYSTEM_NAME STREQUAL
          # "Darwin"` for Apple:
          #   * lib/Basic/CMakeLists.txt does `find_package(UUID REQUIRED)` on
          #     anything else — a Linux dependency for Swift-on-Linux builds;
          #   * SwiftSharedCMakeConfig's Libdispatch.cmake errors out with
          #     "libdispatch requires a newer clang compiler" unless it is Darwin
          #     (on Darwin, dispatch comes from the SDK).
          # The target is still iOS: the sysroot, the architectures, the
          # deployment target and the compiler target triple below say so.
          cmake -S swift -B swift-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Darwin \
            -DCMAKE_MACOSX_BUNDLE=OFF \
            -DCMAKE_OSX_SYSROOT="$SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            -DCMAKE_C_COMPILER_TARGET=arm64-apple-ios$IOS_DEPLOYMENT_TARGET \
            -DCMAKE_CXX_COMPILER_TARGET=arm64-apple-ios$IOS_DEPLOYMENT_TARGET \
            -DCMAKE_Swift_COMPILER="$(xcrun -f swiftc)" \
            -DCMAKE_Swift_COMPILER_TARGET=arm64-apple-ios$IOS_DEPLOYMENT_TARGET \
            -DLLVM_DIR="$PWD/llvm-build/lib/cmake/llvm" \
            -DClang_DIR="$PWD/llvm-build/lib/cmake/clang" \
            -DLLVM_HOST_TRIPLE=arm64-apple-ios$IOS_DEPLOYMENT_TARGET \
            -DLLVM_DEFAULT_TARGET_TRIPLE=arm64-apple-ios$IOS_DEPLOYMENT_TARGET \
            -DLLVM_TABLEGEN="$PWD/llvm-host-build/bin/llvm-tblgen" \
            -DCLANG_TABLEGEN="$PWD/llvm-host-build/bin/clang-tblgen" \
            -DSWIFT_NATIVE_LLVM_TOOLS_PATH="$PWD/llvm-host-build/bin" \
            -DSWIFT_NATIVE_CLANG_TOOLS_PATH="$PWD/llvm-host-build/bin" \
            -DSWIFT_NATIVE_SWIFT_TOOLS_PATH="$HOST_SWIFT_BIN" \
            -DSWIFT_PATH_TO_CMARK_BUILD="$PWD/cmark-host-build" \
            -DSWIFT_PATH_TO_CMARK_SOURCE="$PWD/swift-cmark" \
            -DSWIFT_PATH_TO_STRING_PROCESSING_SOURCE="$PWD/swift-experimental-string-processing" \
            -DSWIFT_PATH_TO_SWIFT_SYNTAX_SOURCE="$PWD/swift-syntax" \
            -DSWIFT_HOST_VARIANT=iphoneos \
            -DSWIFT_HOST_VARIANT_SDK=IOS \
            -DSWIFT_HOST_VARIANT_ARCH=arm64 \
            -DSWIFT_DARWIN_DEPLOYMENT_VERSION_IOS="$IOS_DEPLOYMENT_TARGET" \
            -DSWIFT_BUILD_DYNAMIC_STDLIB=OFF \
            -DSWIFT_BUILD_STATIC_STDLIB=OFF \
            -DSWIFT_BUILD_DYNAMIC_SDK_OVERLAY=OFF \
            -DSWIFT_BUILD_STATIC_SDK_OVERLAY=OFF \
            -DSWIFT_BUILD_STDLIB_EXTRA_TOOLCHAIN_CONTENT=OFF \
            -DSWIFT_BUILD_SOURCEKIT=OFF \
            -DSWIFT_BUILD_SWIFT_SYNTAX=OFF \
            -DSWIFT_BUILD_REMOTE_MIRROR=OFF \
            -DSWIFT_BUILD_PERF_TESTSUITE=OFF \
            -DSWIFT_INCLUDE_TESTS=OFF \
            -DSWIFT_INCLUDE_DOCS=OFF \
            -DSWIFT_INSTALL_COMPONENTS=

          # Proof that the configure produced what the app will link, before the
          # hours of building.
          test -f swift-build/lib/swift/host/libswiftFrontendTool.a \
            || test -f swift-build/lib/libswiftFrontendTool.a \
            || echo "::warning::swiftFrontendTool archive not found where expected; listing swift-build/lib"
          ls -la swift-build/lib | head -40 || true

      - name: Make the restored Swift build newer than its inputs
        if: ${{ steps.swift-cache.outputs.cache-hit == 'true' }}
        shell: bash
        run: |
          set -euxo pipefail
          [ -d swift-build ] && find swift-build -exec touch -c {} + 2>/dev/null || true

      - name: Build the Swift frontend libraries
        if: ${{ inputs.with_swift && !inputs.configure_only }}
        shell: bash
        run: |
          set -euxo pipefail
          # The static library holding `swift::performFrontend`. Its transitive
          # dependencies (swiftAST, swiftSema, the SIL and IRGen libraries, the
          # Clang importer and Swift's own Clang/LLVM) come along with it; the
          # swift/driver executable libraries are deliberately not built, because
          # nothing on the device runs a driver.
          ninja -C swift-build swiftFrontendTool

      - name: Save the Swift build
        if: ${{ always() && inputs.with_swift && !inputs.configure_only && steps.swift-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.swift-cache.outputs.cache-primary-key }}
          path: swift-build

      - name: Verify the Swift frontend
        if: ${{ inputs.with_swift && !inputs.configure_only }}
        shell: bash
        run: |
          set -euxo pipefail
          find swift-build/lib -maxdepth 3 -type f -name 'libswift*.a' | sort > /tmp/swift-archives.txt
          test -s /tmp/swift-archives.txt || { echo "::error::no Swift libraries were produced"; exit 1; }
          echo "Swift archives: $(wc -l < /tmp/swift-archives.txt)"

          # Every archive must be arm64: a bundle that mixes architectures links
          # and then misbehaves, which is worse than one that fails here.
          while IFS= read -r library; do
            archs="$(lipo -archs "$library" 2>/dev/null || true)"
            case " $archs " in
              *" arm64 "*) ;;
              *) echo "::error::$library is not arm64 ($archs)"; exit 1 ;;
            esac
          done < /tmp/swift-archives.txt
          echo "every Swift archive is arm64"

          # `performFrontend` lives in libswiftFrontendTool.a (FrontendTool.cpp).
          # The search is reported, not enforced: the gate that matters is the
          # link below, which fails if the symbol is missing for real. An earlier
          # version of this step failed the job because `nm` did not print the
          # symbol for a library that had just been built.
          FRONTEND_ARCHIVE="$PWD/swift-build/lib/libswiftFrontendTool.a"
          test -f "$FRONTEND_ARCHIVE" || { echo "::error::libswiftFrontendTool.a was not produced"; exit 1; }
          NM=""
          if [ -x llvm-host-build/bin/llvm-nm ]; then NM="$PWD/llvm-host-build/bin/llvm-nm"; else NM="nm"; fi
          echo "--- $NM -gU $FRONTEND_ARCHIVE | grep -c performFrontend"
          SYMBOLS="$("$NM" -gU "$FRONTEND_ARCHIVE" 2>&1 || true)"
          if printf '%s\n' "$SYMBOLS" | grep -q performFrontend; then
            echo "performFrontend is in libswiftFrontendTool.a"
          else
            echo "::warning::no performFrontend symbol in libswiftFrontendTool.a; the link below decides"
            printf '%s\n' "$SYMBOLS" | head -20
          fi

      - name: Compile-check XForge bridge against LLVM headers
        if: ${{ !inputs.configure_only }}
        shell: bash
        run: |
          set -euxo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          EXTRA_DEFINES=()
          EXTRA_INCLUDES=()
          if [ "${{ inputs.with_swift }}" = "true" ]; then
            # Exercises the Swift half of the bridge: with the define and the
            # headers present, NativeToolchainBridge.mm compiles the code path
            # that calls swift::performFrontend instead of the stub.
            EXTRA_DEFINES+=(-DXFORGE_HAS_SWIFT_FRONTEND=1)
            EXTRA_INCLUDES+=(-I swift/include)
            if [ -d swift-build/include ]; then
              EXTRA_INCLUDES+=(-I swift-build/include)
            fi
            if [ -d swift-build/tools/swift/include ]; then
              EXTRA_INCLUDES+=(-I swift-build/tools/swift/include)
            fi
          fi
          xcrun --sdk iphoneos clang++ \
            -std=c++20 \
            -arch arm64 \
            -miphoneos-version-min=$IOS_DEPLOYMENT_TARGET \
            -isysroot "$SDK" \
            -DXFORGE_HAS_LLVM=1 \
            "${EXTRA_DEFINES[@]}" \
            -I llvm-project/llvm/include \
            -I llvm-build/include \
            -I llvm-project/clang/include \
            -I llvm-build/tools/clang/include \
            -I llvm-project/lld/include \
            "${EXTRA_INCLUDES[@]}" \
            -I App/NativeToolchain \
            -c App/NativeToolchain/NativeToolchainBridge.mm \
            -o /tmp/NativeToolchainBridge.o

      - name: Stage native toolchain SDK
        if: ${{ !inputs.configure_only }}
        shell: bash
        run: |
          set -euxo pipefail
          # Two header roots, searched in this order, and they must not be merged:
          # the build tree generates a *file* at `swift/bridging` (the C++ interop
          # header, included as <swift/bridging>) while the sources have a
          # *directory* of the same name (`include/swift/Bridging/`, holding
          # ASTGen.h and MacroEvaluation.h). On a case-insensitive filesystem that
          # is a single path, so copying the build tree over the source tree fails
          # with "cp: .../swift/bridging: Is a directory" and stages nothing.
          #
          # `-L` is load-bearing too: the build tree mirrors headers as symlinks
          # into this checkout, and a bundle that ships those links is dead
          # anywhere but this runner.
          mkdir -p dist/include-generated dist/include dist/lib
          stage_headers() { cp -R -L "$1" "$2"; }

          stage_headers llvm-project/llvm/include/llvm dist/include/
          stage_headers llvm-project/clang/include/clang dist/include/
          stage_headers llvm-project/lld/include/lld dist/include/

          stage_headers llvm-build/include/llvm dist/include-generated/
          if [ -d llvm-build/tools/clang/include/clang ]; then
            stage_headers llvm-build/tools/clang/include/clang dist/include-generated/
          fi

          if [ "${{ inputs.with_swift }}" = "true" ]; then
            stage_headers swift/include/swift dist/include/
            for swift_headers in swift-build/include/swift swift-build/tools/swift/include/swift; do
              if [ -d "$swift_headers" ]; then
                stage_headers "$swift_headers" dist/include-generated/
              fi
            done
          fi

          for required in dist/include/llvm dist/include/clang dist/include/lld; do
            [ -d "$required" ] || { echo "::error::missing staged header root $required"; exit 1; }
          done

          # A symlink here would point into the runner's checkout.
          if [ -n "$(find dist/include dist/include-generated -type l -print -quit)" ]; then
            echo "::error::staged headers still contain symlinks:"
            find dist/include dist/include-generated -type l -print
            exit 1
          fi

          # Flatten the static dependency graph — LLVM's, Clang's, LLD's and (when
          # built) Swift's — into one archive. XForge then links a single library
          # instead of depending on archive ordering, and a Swift frontend that
          # links an LLVM built in the same configuration cannot drift from it.
          find llvm-build/lib -maxdepth 1 -type f -name '*.a' -print | sort > /tmp/archives.txt
          if [ -d cmark-ios-build ]; then
            find cmark-ios-build -type f -name 'libcmark-gfm*.a' -print | sort >> /tmp/archives.txt
          fi
          if [ "${{ inputs.with_swift }}" = "true" ]; then
            find swift-build/lib -maxdepth 3 -type f -name '*.a' -print | sort >> /tmp/archives.txt
          fi
          test -s /tmp/archives.txt
          ARCHIVES=()
          while IFS= read -r archive; do
            ARCHIVES+=("$archive")
          done < /tmp/archives.txt
          /usr/bin/libtool -static -o dist/lib/libXForgeNativeToolchain.a "${ARCHIVES[@]}"

          cat > /tmp/native_link_smoke.mm <<'EOF'
          #include "NativeToolchainBridge.h"
          int main(void) {
              return xf_native_toolchain_available() ? 0 : 1;
          }
          EOF

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang++ \
            -std=c++20 \
            -arch arm64 \
            -miphoneos-version-min=$IOS_DEPLOYMENT_TARGET \
            -isysroot "$SDK" \
            -I App/NativeToolchain \
            -c /tmp/native_link_smoke.mm \
            -o /tmp/native_link_smoke.o

          xcrun --sdk iphoneos clang++ \
            -arch arm64 \
            -miphoneos-version-min=$IOS_DEPLOYMENT_TARGET \
            -isysroot "$SDK" \
            /tmp/native_link_smoke.o \
            /tmp/NativeToolchainBridge.o \
            dist/lib/libXForgeNativeToolchain.a \
            -lc++ -lz -liconv -lsqlite3 \
            -framework Foundation \
            -o /tmp/XForgeNativeToolchainSmoke \
            2> /tmp/native-link-errors.txt || {
              echo "::error::linking the toolchain into an app-shaped target failed"
              tail -60 /tmp/native-link-errors.txt
              exit 1
            }

          file /tmp/XForgeNativeToolchainSmoke
          file /tmp/NativeToolchainBridge.o
          cp /tmp/NativeToolchainBridge.o dist/

          cat > dist/manifest.txt <<EOF
          target=arm64-apple-ios
          deployment_target=$IOS_DEPLOYMENT_TARGET
          llvm_commit=$(git -C llvm-project rev-parse HEAD)
          swift_frontend=${{ inputs.with_swift && '1' || '0' }}
          swift_ref=${{ inputs.with_swift && env.SWIFT_REF || 'none' }}
          built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          archive=lib/libXForgeNativeToolchain.a
          header_roots=include-generated include
          EOF
          tar -C dist -czf XForgeNativeToolchain-arm64-ios.tar.gz .

      - name: Upload native toolchain artifact
        if: ${{ !inputs.configure_only }}
        uses: actions/upload-artifact@v4
        with:
          name: XForgeNativeToolchain-arm64-ios
          path: XForgeNativeToolchain-arm64-ios.tar.gz
          if-no-files-found: error
          compression-level: 0
