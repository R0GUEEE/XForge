name: Validate embedded Linux emulator stack

# Empirically validates the on-device software stack: Alpine aarch64 + gcompat + Swift
# + xtool running under QEMU user-mode (qemu-aarch64). Swift comes from the official
# multi-arch swift Docker image (swift.org direct URLs are gone).

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU user-mode + register arm64 binfmt
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-user-static
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes || true

      - name: Assemble Alpine aarch64 rootfs (xtool + gcompat)
        run: bash EmbeddedLinux/build-rootfs.sh ./rootfs

      - name: Extract aarch64 Swift toolchain from official image
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD/rootfs:/rootfs" \
            swift:6.1.2-noble \
            sh -c 'cp -a /usr/local/. /rootfs/usr/local/'
          ls -la rootfs/usr/local/bin/swift

      - name: Sanity — qemu-aarch64 runs a static binary
        run: |
          set -e
          qemu-aarch64 /bin/true && echo "QEMU_OK: static binary runs"

      - name: Run Alpine native busybox under qemu (control, musl)
        run: |
          set +e
          (qemu-aarch64 -L rootfs rootfs/bin/busybox --version 2>&1 || echo "BB_EXIT=$?") | head

      - name: Run Swift under qemu-aarch64 (musl + gcompat)
        run: |
          set +e
          file rootfs/usr/local/bin/swift 2>/dev/null || true
          (qemu-aarch64 -L rootfs rootfs/usr/local/bin/swift --version 2>&1 || echo "SWIFT_EXIT=$?") | head -20

      - name: Run xtool under qemu-aarch64
        run: |
          set +e
          export APPIMAGE_EXTRACT_AND_RUN=1
          (qemu-aarch64 -L rootfs rootfs/usr/local/bin/xtool --version 2>&1 || echo "XTOOL_EXIT=$?") | head -15
