name: Build unsigned XForge IPA

# Produces an IPA that is ready the moment it is installed: the Alpine rootfs
# bundled inside the app is *provisioned* — apk build environment, the glibc
# compatibility layer, xtool, swiftly + the Swift toolchain, and the darwin Swift
# SDK when a release has one — so the app has nothing to install on the device and
# needs no network to build a project. See EmbeddedLinux/build-rootfs-payload.sh.
#
# Two jobs, one dispatch: the payload has to be built on arm64 *Linux* (it chroots
# into Alpine and runs the guest's own arm64 binaries), while the app needs macOS +
# Xcode. The payload is cached by content key, so only a change to the provisioning
# pays for it again.

on:
  workflow_dispatch:
    inputs:
      include_darwin_sdk:
        description: "darwin Swift SDK baked into the bundled rootfs"
        type: choice
        # Off by default: the SDK is a ~200 MB asset that the app fetches on
        # first use anyway, and it is a large part of the bundle. Set 1 to ship
        # an app that can build with no network at all.
        default: "0"
        options: ["0", "1"]

permissions:
  contents: write

concurrency:
  group: ipa
  cancel-in-progress: true

jobs:
  payload:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      XFORGE_INCLUDE_SDK: ${{ inputs.include_darwin_sdk }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the payload key
        id: key
        run: |
          set -e
          key="$(bash EmbeddedLinux/payload-key.sh)"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "payload key: $key (darwin SDK: $XFORGE_INCLUDE_SDK)"

      - name: Restore a cached payload with this key
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: dist/rootfs
          key: xforge-payload-${{ steps.key.outputs.key }}

      - name: Install pigz (parallel gzip for the 6 GB rootfs)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pigz

      - name: Build the provisioned rootfs
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -e
          # root does the chroot; the knobs have to survive the sudo boundary, so
          # they are named explicitly rather than inherited.
          sudo --preserve-env=XFORGE_INCLUDE_SDK,GH_TOKEN,XFORGE_ROOTFS_URL \
            bash EmbeddedLinux/build-rootfs-payload.sh dist/rootfs

      - name: Save the payload for the next build
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dist/rootfs
          key: xforge-payload-${{ steps.key.outputs.key }}

      - name: Upload the payload for the app job
        uses: actions/upload-artifact@v4
        with:
          name: xforge-rootfs-payload
          path: dist/rootfs/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  build:
    needs: payload
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Check out the iSH-AOK engine (submodule)
        run: |
          set -e
          git submodule update --init --depth 1 Vendor/ish-AOK
          # Only what the core actually links: the archive reader (rootfs import)
          # and smallclue (the built-in toolbox). The heavy native-program
          # submodules (bash, zsh, helix, tokio) stay out of the checkout.
          git -C Vendor/ish-AOK submodule update --init --depth 1 deps/libarchive deps/smallclue

      - name: Install build tools
        run: brew install xcodegen meson ninja llvm lld libarchive

      - name: Download the provisioned rootfs payload
        uses: actions/download-artifact@v4
        with:
          name: xforge-rootfs-payload
          path: dist/rootfs

      - name: Bundle the provisioned rootfs in the app
        run: |
          set -e
          archive="$(ls dist/rootfs/*-provisioned.tar.gz | head -1)"
          echo "payload: $archive ($(du -h "$archive" | cut -f1))"
          XFORGE_ROOTFS=payload XFORGE_ROOTFS_ARCHIVE="$PWD/$archive" \
            bash EmbeddedLinux/fetch-rootfs.sh

      - name: Build the embedded iSH-AOK core (iOS arm64)
        run: bash EmbeddedLinux/build-ish-aok-core.sh

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Resolve SPM dependencies
        run: |
          set -o pipefail
          xcodebuild -project XForge.xcodeproj -scheme XForge \
            -resolvePackageDependencies \
            -destination 'generic/platform=iOS' 2>&1 | tee /tmp/resolve.log

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          rm -rf build
          xcodebuild -project XForge.xcodeproj -scheme XForge \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            archive -archivePath build/XForge.xcarchive 2>&1 | tee /tmp/build.log

      - name: Verify the complete embedded-Linux bundle
        run: |
          set -e
          APP="build/XForge.xcarchive/Products/Applications/XForge.app"
          test -d "$APP"
          test -x "$APP/XForge"
          test -f "$APP/Info.plist"
          test -f "$APP/Assets.car"
          test -f "$APP/install-toolchain.sh"

          ARCHIVE="$APP/alpine-minirootfs-3.23.3-aarch64-provisioned.tar.gz"
          if [ ! -f "$ARCHIVE" ]; then
            echo "::error::the app does not bundle the provisioned rootfs"
            ls -la "$APP" | head -40
            exit 1
          fi
          tar -tzf "$ARCHIVE" >/dev/null
          echo "rootfs bundled: $(du -h "$ARCHIVE" | cut -f1)"

          # The toolchain must be *in* the bundle, not merely promised by it. The
          # payload builder records what it installed in a manifest inside the
          # rootfs, so the packed artifact can prove it on its own.
          member="$(tar -tzf "$ARCHIVE" | grep -E 'usr/local/share/xforge/payload-manifest\.txt$' | head -1)"
          if [ -z "$member" ]; then
            echo "::error::the bundled rootfs has no payload manifest — it is not a provisioned payload"
            exit 1
          fi
          tar -xzOf "$ARCHIVE" "$member" | tee /tmp/bundled-manifest.txt
          grep -qE '^swift:[[:space:]]+Swift version' /tmp/bundled-manifest.txt \
            || { echo "::error::no Swift toolchain in the bundled rootfs"; exit 1; }
          grep -qE '^xtool:[[:space:]]+xtool ' /tmp/bundled-manifest.txt \
            || { echo "::error::no xtool in the bundled rootfs"; exit 1; }
          for path in usr/local/bin/swift usr/local/bin/xtool usr/local/share/xforge/glibc.env; do
            tar -tzf "$ARCHIVE" | grep -qE "(^|/)$path$" \
              || { echo "::error::the bundled rootfs is missing $path"; exit 1; }
          done
          tar -tzf "$ARCHIVE" | grep -qE "(^|/)swiftly/toolchains/" \
            || { echo "::error::the bundled rootfs has no Swift toolchain"; exit 1; }
          # The darwin SDK is opt-in, and the manifest is where its absence is
          # recorded — so assert the bundle matches what was asked for.
          if [ "${{ inputs.include_darwin_sdk }}" = "0" ]; then
            grep -qE '^darwin-sdk:[[:space:]]+not bundled' /tmp/bundled-manifest.txt \
              || { echo "::error::the darwin SDK is in the bundled rootfs but this build excludes it"; exit 1; }
            echo "darwin SDK: not bundled (the app fetches it on first use)"
          fi
          echo "::notice::the bundled rootfs ships a working toolchain"

          {
            echo "### Bundled rootfs (preinstalled)"
            echo
            echo '```'
            cat /tmp/bundled-manifest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify app information
        run: |
          set -e
          APP="build/XForge.xcarchive/Products/Applications/XForge.app"
          PLIST="$APP/Info.plist"
          get() { /usr/libexec/PlistBuddy -c "Print :$1" "$PLIST"; }
          VER="$(get CFBundleShortVersionString)"
          BUILD="$(get CFBundleVersion)"
          NAME="$(get CFBundleDisplayName)"
          BID="$(get CFBundleIdentifier)"
          echo "bundle id : $BID"
          echo "name      : $NAME"
          echo "version   : $VER ($BUILD)"
          [ "$VER" = "0.5.0" ]   || { echo "::error::CFBundleShortVersionString is '$VER', expected 0.5.0"; exit 1; }
          [ "$BID" = "com.r0gueee.xforge" ] || { echo "::error::unexpected bundle id '$BID'"; exit 1; }
          [ "$NAME" = "XForge" ] || { echo "::error::unexpected display name '$NAME'"; exit 1; }
          # The icon must reach the bundle: either as legacy AppIcon*.png files at
          # the bundle root, or compiled into Assets.car (Xcode 14+ does both).
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon" "$PLIST" >/dev/null \
            || { echo "::error::no CFBundleIcons in Info.plist — the app icon is not wired up"; exit 1; }
          test -f "$APP/Assets.car" || { echo "::error::no Assets.car in the bundle"; exit 1; }
          echo "app icon  : wired (CFBundleIcons + Assets.car)"

      - name: Verify entitlements
        run: |
          set -e
          # plistlib rather than PlistBuddy: the key "get-task-allow" contains a
          # dash, which PlistBuddy's :key path syntax does not accept, and a check
          # that cannot read the file it is checking is worse than no check.
          python3 - <<'PY'
          import plistlib, sys

          path = "Support/XForge.entitlements"
          required = [
              "get-task-allow",
              "application-identifier",
              "com.apple.developer.kernel.extended-virtual-addressing",
              "com.apple.developer.kernel.increased-memory-limit",
          ]
          with open(path, "rb") as handle:
              entitlements = plistlib.load(handle)

          missing = [key for key in required if key not in entitlements]
          if missing:
              print(f"::error::{path} is missing {', '.join(missing)}")
              sys.exit(1)

          # The two the engine cannot run without have to be true, not merely
          # present: a false value reads as "declared" and grants nothing.
          for key in ("com.apple.developer.kernel.extended-virtual-addressing",
                      "com.apple.developer.kernel.increased-memory-limit"):
              if entitlements[key] is not True:
                  print(f"::error::{key} must be true")
                  sys.exit(1)

          print("entitlements (the IPA is unsigned, so a sideloader re-applies these):")
          for key in sorted(entitlements):
              print(f"  {key} = {entitlements[key]}")
          PY

          # Declaring them is not the same as using them: the target has to have
          # the file wired as CODE_SIGN_ENTITLEMENTS, or a signed build would
          # ship without any of it.
          settings="$(xcodebuild -project XForge.xcodeproj -scheme XForge \
            -destination 'generic/platform=iOS' -showBuildSettings 2>/dev/null)"
          echo "$settings" | grep -q "CODE_SIGN_ENTITLEMENTS" \
            || { echo "::error::the target sets no CODE_SIGN_ENTITLEMENTS"; exit 1; }
          case "$settings" in
            *XForge.entitlements*) echo "wired: $(echo "$settings" | grep "CODE_SIGN_ENTITLEMENTS" | head -1 | sed 's/^ *//')" ;;
            *) echo "::error::CODE_SIGN_ENTITLEMENTS does not point at Support/XForge.entitlements"; exit 1 ;;
          esac

          {
            echo "### Entitlements"
            echo
            echo '```'
            echo "$settings" | grep "CODE_SIGN_ENTITLEMENTS" | head -1 | sed 's/^ *//'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package unsigned IPA
        run: |
          set -e
          APP="build/XForge.xcarchive/Products/Applications/XForge.app"
          IPA="dist/XForge-0.5.0-unsigned.ipa"
          mkdir -p dist/Payload
          ditto "$APP" dist/Payload/XForge.app
          ditto -c -k --keepParent dist/Payload "$IPA"
          unzip -l "$IPA" | grep -q 'Payload/XForge.app/XForge$'
          unzip -l "$IPA" | grep -q 'Payload/XForge.app/install-toolchain.sh$'
          unzip -l "$IPA" | grep -q 'Payload/XForge.app/alpine-minirootfs-3.23.3-aarch64-provisioned.tar.gz$'
          echo "ipa: $(du -h "$IPA" | cut -f1)"
          echo "artifact=$GITHUB_WORKSPACE/$IPA" >> "$GITHUB_ENV"
          echo "ipa_name=$(basename "$IPA")" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XForge-unsigned-ipa
          path: dist/XForge-0.5.0-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload to release (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: xforge-${{ github.run_number }}
          name: XForge 0.5.0 — toolchain preinstalled
          files: dist/XForge-0.5.0-unsigned.ipa
          body_path: CHANGELOG.md
          generate_release_notes: false
