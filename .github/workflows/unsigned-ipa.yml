name: Build unsigned XForge IPA

# The Alpine rootfs is assembled on native arm64 Linux before the macOS archive.
# `install-toolchain.sh all` runs inside that Alpine filesystem, so its apk build
# dependencies, Swift and xtool are installed in the root the terminal boots. The
# root is provisioned purpose-built for running as XForge's embedded Linux system
# (a build environment, not a general-purpose distro), so it is slimmed before
# packing. The Darwin SDK remains an on-demand guest component (a 200 MB asset
# most builds fetch from the guest instead of shipping in every IPA).
#
# The engine itself is OpenMinis/ish-arm64 (Vendor/ish-arm64, a submodule): a
# native aarch64 guest backend, so the Alpine rootfs runs as a same-architecture
# guest instead of being cross-translated from x86.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  payload:
    name: Provision Alpine build root
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    # Superseding dispatches cancel an older *payload* run, but only this job:
    # the payload is the part that is safe to throw away and re-run. The `build`
    # job below (and the release it publishes) must never be cancelled half-way,
    # which is why the workflow has no top-level concurrency group — a
    # `cancel-in-progress: true` there killed IPAs that were already packaged.
    concurrency:
      group: ipa-payload
      cancel-in-progress: true
    env:
      # The release bakes in Alpine build dependencies, Swift and xtool. The
      # Darwin SDK stays an explicit in-guest component installed on demand —
      # it is a 200 MB asset most builds never need baked into every IPA.
      XFORGE_INCLUDE_SDK: "0"
      XFORGE_INSTALL_XTOOL: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install payload build tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pigz shellcheck

      # The payload builder is a shell script that runs for ~10 minutes behind a
      # `set -euo pipefail`; a one-line bug in it costs the whole job. These
      # checks are seconds, and they run before the expensive provisioning.
      - name: Check the payload builder
        run: |
          set -euo pipefail
          bash -n EmbeddedLinux/build-rootfs-payload.sh
          shellcheck -S error \
            EmbeddedLinux/build-rootfs-payload.sh \
            EmbeddedLinux/build-ish-core.sh \
            EmbeddedLinux/fetch-rootfs.sh \
            EmbeddedLinux/install-toolchain.sh \
            EmbeddedLinux/payload-key.sh
          # The size measurement must survive a bind-mounted /proc: the failure
          # that broke this job was `$(du -skx …)` aborting the build.
          sudo -E bash Tools/test-payload-sizing.sh

      - name: Install project dependencies and Swift into Alpine
        run: |
          set -euo pipefail
          # This chroots into Alpine and runs the same guest installer exposed by
          # the app. It installs apk build dependencies, glibc, swiftly, Swift and
          # xtool in the guest root, never on the iOS host, then slims the result
          # (docs, man pages, locales, caches, bytecode) so the archive only holds
          # what running XForge's embedded Linux actually needs.
          # `sudo` otherwise drops this setting and the payload builder's
          # default `auto` mode tries to install the Darwin SDK as well.
          sudo --preserve-env=XFORGE_INCLUDE_SDK,XFORGE_INSTALL_XTOOL \
            bash EmbeddedLinux/build-rootfs-payload.sh dist/rootfs

      - name: Validate provisioned Alpine payload
        run: |
          set -euo pipefail
          archive="$(find dist/rootfs -maxdepth 1 -name '*-provisioned.tar.gz' -print -quit)"
          test -n "$archive"
          tar -tzf "$archive" > /tmp/rootfs-contents.txt
          for path in \
            usr/local/bin/swift \
            usr/local/share/xforge/build-environment-v2 \
            usr/local/share/xforge/payload-manifest.txt; do
            grep -qE "(^|/)$path$" /tmp/rootfs-contents.txt \
              || { echo "::error::payload is missing $path"; exit 1; }
          done
          grep -qE '(^|/)swiftly/toolchains/' /tmp/rootfs-contents.txt \
            || { echo '::error::payload has no Swift toolchain'; exit 1; }
          manifest="$(grep -E '/usr/local/share/xforge/payload-manifest.txt$' /tmp/rootfs-contents.txt | head -1)"
          tar -xzOf "$archive" "$manifest" | tee /tmp/payload-manifest.txt
          grep -qE '^base:[[:space:]]+alpine-minirootfs-3\.24\.2-aarch64\.tar\.gz$' /tmp/payload-manifest.txt
          grep -qE '^rootfs:[[:space:]]+3\.24\.2$' /tmp/payload-manifest.txt
          grep -qE "(^|/)usr/local/bin/xtool$" /tmp/rootfs-contents.txt \
            || { echo "::error::payload is missing usr/local/bin/xtool"; exit 1; }
          grep -qE "(^|/)opt/xtool/usr/bin/xtool$" /tmp/rootfs-contents.txt \
            || { echo "::error::payload has no unpacked xtool"; exit 1; }
          ! grep -qE '^xtool:[[:space:]]+not bundled$' /tmp/payload-manifest.txt
          ! grep -qE '(^|/)darwin\.artifactbundle' /tmp/rootfs-contents.txt
          grep -qE '^darwin-sdk:[[:space:]]+not bundled$' /tmp/payload-manifest.txt
          echo "payload=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload provisioned Alpine payload
        uses: actions/upload-artifact@v4
        with:
          name: xforge-provisioned-alpine-rootfs
          path: dist/rootfs/*-provisioned.tar.gz
          if-no-files-found: error
          retention-days: 1

  build:
    needs: payload
    runs-on: macos-15
    timeout-minutes: 90
    # Serialized, never cancelled: two dispatches may provision payloads at the
    # same time, but only one may be archiving and publishing at a time. The
    # release tag is `xforge-${{ github.run_number }}` and every run has its own
    # number, so a queued run is not lost — it just waits its turn.
    concurrency:
      group: ipa-build
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Download provisioned Alpine payload
        uses: actions/download-artifact@v4
        with:
          name: xforge-provisioned-alpine-rootfs
          path: dist/rootfs

      - name: Check out the ish-arm64 engine (submodule)
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 Vendor/ish-arm64
          # libarchive is what unpacks the rootfs archive, in the app and in the
          # engine's own fakefs tools. libapps/linux are not needed: XForge
          # embeds no native host shells, and uses the ish kernel, not Linux.
          git -C Vendor/ish-arm64 submodule update --init --depth 1 deps/libarchive

      - name: Install build tools
        run: |
          # xcodegen generates the Xcode project; meson/ninja build the engine's
          # core; llvm/lld provide the cross-linker its i386 VDSO needs (Apple's
          # clang cannot do that link). libarchive is deliberately not installed
          # here: the app links the copy built from the vendored submodule
          # (deps/libarchive.xcodeproj), not a Homebrew package.
          brew install xcodegen meson ninja llvm lld

      - name: Build the embedded ish-arm64 core (iOS arm64)
        run: bash EmbeddedLinux/build-ish-core.sh

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Resolve SPM dependencies
        run: |
          set -o pipefail
          xcodebuild -project XForge.xcodeproj -scheme XForge \
            -resolvePackageDependencies \
            -destination 'generic/platform=iOS' 2>&1 | tee /tmp/resolve.log

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild -project XForge.xcodeproj -scheme XForge \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            test 2>&1 | tee /tmp/tests.log

      - name: Bundle the provisioned Alpine rootfs in the app
        run: |
          set -euo pipefail
          archive="$(find dist/rootfs -maxdepth 1 -name '*-provisioned.tar.gz' -print -quit)"
          test -n "$archive"
          XFORGE_ROOTFS=payload XFORGE_REQUIRE_XTOOL=1 XFORGE_ROOTFS_ARCHIVE="$archive" \
            bash EmbeddedLinux/fetch-rootfs.sh
          # XcodeGen resolves resources when it generates the project. Regenerate
          # after replacing the small source archive with the provisioned payload.
          xcodegen generate --spec project.yml

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          rm -rf build
          xcodebuild -project XForge.xcodeproj -scheme XForge \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            archive -archivePath build/XForge.xcarchive 2>&1 | tee /tmp/build.log

      - name: Verify the provisioned Alpine bundle
        run: |
          set -euo pipefail
          APP="build/XForge.xcarchive/Products/Applications/XForge.app"
          ARCHIVE="$APP/alpine-minirootfs-3.24.2-aarch64-provisioned.tar.gz"
          test -d "$APP"
          test -x "$APP/XForge"
          test -f "$ARCHIVE"
          tar -tzf "$ARCHIVE" > /tmp/rootfs-contents.txt
          for path in \
            usr/local/bin/swift \
            usr/local/share/xforge/build-environment-v2 \
            usr/local/share/xforge/payload-manifest.txt; do
            grep -qE "(^|/)$path$" /tmp/rootfs-contents.txt \
              || { echo "::error::bundled rootfs is missing $path"; exit 1; }
          done
          grep -qE '(^|/)swiftly/toolchains/' /tmp/rootfs-contents.txt \
            || { echo '::error::bundled rootfs has no Swift toolchain'; exit 1; }
          manifest="$(grep -E '/usr/local/share/xforge/payload-manifest.txt$' /tmp/rootfs-contents.txt | head -1)"
          tar -xzOf "$ARCHIVE" "$manifest" | tee /tmp/payload-manifest.txt
          grep -qE "(^|/)usr/local/bin/xtool$" /tmp/rootfs-contents.txt \
            || { echo "::error::bundled rootfs is missing usr/local/bin/xtool"; exit 1; }
          ! grep -qE '^xtool:[[:space:]]+not bundled$' /tmp/payload-manifest.txt
          ! grep -qE '(^|/)darwin\.artifactbundle' /tmp/rootfs-contents.txt
          {
            echo '### Bundled Alpine build root'
            echo
            echo '```'
            cat /tmp/payload-manifest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify app information
        run: |
          set -euo pipefail
          APP="build/XForge.xcarchive/Products/Applications/XForge.app"
          PLIST="$APP/Info.plist"
          test -f "$PLIST"
          test -f "$APP/Assets.car"
          get() { /usr/libexec/PlistBuddy -c "Print :$1" "$PLIST"; }
          test "$(get CFBundleShortVersionString)" = "0.5.0"
          test "$(get CFBundleIdentifier)" = "com.r0gueee.xforge"
          test "$(get CFBundleDisplayName)" = "XForge"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon" "$PLIST" >/dev/null

      - name: Verify entitlements are configured
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import plistlib
          required = {
              "get-task-allow",
              "application-identifier",
              "com.apple.developer.kernel.extended-virtual-addressing",
              "com.apple.developer.kernel.increased-memory-limit",
          }
          with open("Support/XForge.entitlements", "rb") as handle:
              entitlements = plistlib.load(handle)
          missing = required - entitlements.keys()
          assert not missing, f"missing entitlements: {sorted(missing)}"
          assert entitlements["com.apple.developer.kernel.extended-virtual-addressing"] is True
          assert entitlements["com.apple.developer.kernel.increased-memory-limit"] is True
          PY
          settings="$(xcodebuild -project XForge.xcodeproj -scheme XForge \
            -destination 'generic/platform=iOS' -showBuildSettings 2>/dev/null)"
          case "$settings" in
            *XForge.entitlements*) ;;
            *) echo '::error::CODE_SIGN_ENTITLEMENTS is not wired'; exit 1 ;;
          esac

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="build/XForge.xcarchive/Products/Applications/XForge.app"
          IPA="dist/XForge-0.5.0-unsigned.ipa"
          mkdir -p dist/Payload
          ditto "$APP" dist/Payload/XForge.app
          ditto -c -k --keepParent dist/Payload "$IPA"
          unzip -t "$IPA"
          unzip -Z1 "$IPA" | grep -q 'Payload/XForge.app/alpine-minirootfs-3.24.2-aarch64-provisioned.tar.gz$'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XForge-unsigned-ipa
          path: dist/XForge-0.5.0-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload to release (manual trigger only)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: xforge-${{ github.run_number }}
          name: XForge 0.5.0 — provisioned Alpine terminal
          files: dist/XForge-0.5.0-unsigned.ipa
          body_path: CHANGELOG.md
          generate_release_notes: false
