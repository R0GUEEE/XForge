name: Build unsigned XForge IPA

# Produces an unsigned IPA with the plain Alpine aarch64 rootfs embedded. The
# terminal imports this root directly into iSH-AOK; Swift, xtool, and SDKs are
# deliberately not bundled or installed by the build.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Check out the iSH-AOK engine (submodule)
        run: |
          set -e
          git submodule update --init --depth 1 Vendor/ish-AOK
          # Only what the core actually links: the archive reader (rootfs import)
          # and smallclue (the built-in toolbox). The heavy native-program
          # submodules (bash, zsh, helix, tokio) stay out of the checkout.
          git -C Vendor/ish-AOK submodule update --init --depth 1 deps/libarchive deps/smallclue

      - name: Install build tools
        run: brew install xcodegen meson ninja llvm lld libarchive

      - name: Bundle the plain Alpine rootfs in the app
        run: |
          set -euo pipefail
          XFORGE_ROOTFS=plain bash EmbeddedLinux/fetch-rootfs.sh

      - name: Build the embedded iSH-AOK core (iOS arm64)
        run: bash EmbeddedLinux/build-ish-aok-core.sh

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Resolve SPM dependencies
        run: |
          set -o pipefail
          xcodebuild -project XForge.xcodeproj -scheme XForge \
            -resolvePackageDependencies \
            -destination 'generic/platform=iOS' 2>&1 | tee /tmp/resolve.log

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          rm -rf build
          xcodebuild -project XForge.xcodeproj -scheme XForge \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            archive -archivePath build/XForge.xcarchive 2>&1 | tee /tmp/build.log

      - name: Verify the plain embedded-Alpine bundle
        run: |
          set -e
          APP="build/XForge.xcarchive/Products/Applications/XForge.app"
          test -d "$APP"
          test -x "$APP/XForge"
          test -f "$APP/Info.plist"
          test -f "$APP/Assets.car"
          ARCHIVE="$APP/alpine-minirootfs-3.23.3-aarch64.tar.gz"
          if [ ! -f "$ARCHIVE" ]; then
            echo "::error::the app does not bundle the plain Alpine rootfs"
            ls -la "$APP" | head -40
            exit 1
          fi
          tar -tzf "$ARCHIVE" >/dev/null
          echo "rootfs bundled: $(du -h "$ARCHIVE" | cut -f1)"

          tar -tzf "$ARCHIVE" > /tmp/rootfs-contents.txt
          grep -qE '(^|/)bin/sh$' /tmp/rootfs-contents.txt \
            || { echo "::error::the bundled rootfs has no shell"; exit 1; }
          grep -qE '(^|/)etc/alpine-release$' /tmp/rootfs-contents.txt \
            || { echo "::error::the bundled archive is not Alpine"; exit 1; }
          if grep -qE '(^|/)(usr/local/bin/(swift|xtool)|swiftly/toolchains/|usr/local/share/xforge/)' /tmp/rootfs-contents.txt; then
            echo "::error::the bundled rootfs contains a preinstalled toolchain"
            grep -E '(^|/)(usr/local/bin/(swift|xtool)|swiftly/toolchains/|usr/local/share/xforge/)' /tmp/rootfs-contents.txt
            exit 1
          fi
          echo "::notice::the app bundles plain Alpine only; no Swift, xtool, or SDK payload"

          {
            echo "### Bundled rootfs (plain Alpine)"
            echo
            echo '```'
            grep -E '(^|/)(bin/sh|etc/alpine-release)$' /tmp/rootfs-contents.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify app information
        run: |
          set -e
          APP="build/XForge.xcarchive/Products/Applications/XForge.app"
          PLIST="$APP/Info.plist"
          get() { /usr/libexec/PlistBuddy -c "Print :$1" "$PLIST"; }
          VER="$(get CFBundleShortVersionString)"
          BUILD="$(get CFBundleVersion)"
          NAME="$(get CFBundleDisplayName)"
          BID="$(get CFBundleIdentifier)"
          echo "bundle id : $BID"
          echo "name      : $NAME"
          echo "version   : $VER ($BUILD)"
          [ "$VER" = "0.5.0" ]   || { echo "::error::CFBundleShortVersionString is '$VER', expected 0.5.0"; exit 1; }
          [ "$BID" = "com.r0gueee.xforge" ] || { echo "::error::unexpected bundle id '$BID'"; exit 1; }
          [ "$NAME" = "XForge" ] || { echo "::error::unexpected display name '$NAME'"; exit 1; }
          # The icon must reach the bundle: either as legacy AppIcon*.png files at
          # the bundle root, or compiled into Assets.car (Xcode 14+ does both).
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon" "$PLIST" >/dev/null \
            || { echo "::error::no CFBundleIcons in Info.plist — the app icon is not wired up"; exit 1; }
          test -f "$APP/Assets.car" || { echo "::error::no Assets.car in the bundle"; exit 1; }
          echo "app icon  : wired (CFBundleIcons + Assets.car)"

      - name: Verify entitlements
        run: |
          set -e
          # plistlib rather than PlistBuddy: the key "get-task-allow" contains a
          # dash, which PlistBuddy's :key path syntax does not accept, and a check
          # that cannot read the file it is checking is worse than no check.
          python3 - <<'PY'
          import hashlib, plistlib, sys

          path = "Support/XForge.entitlements"
          raw = open(path, "rb").read()
          # Print what was actually read: the previous failure reported every key
          # missing for a file that is correct, which is only diagnosable if the
          # check says which bytes it looked at.
          print(f"{path}: {len(raw)} bytes, sha256 {hashlib.sha256(raw).hexdigest()[:16]}")
          required = [
              "get-task-allow",
              "application-identifier",
              "com.apple.developer.kernel.extended-virtual-addressing",
              "com.apple.developer.kernel.increased-memory-limit",
          ]
          entitlements = plistlib.loads(raw)

          missing = [key for key in required if key not in entitlements]
          if missing:
              print(f"::error::{path} is missing {', '.join(missing)}")
              sys.exit(1)

          # The two the engine cannot run without have to be true, not merely
          # present: a false value reads as "declared" and grants nothing.
          for key in ("com.apple.developer.kernel.extended-virtual-addressing",
                      "com.apple.developer.kernel.increased-memory-limit"):
              if entitlements[key] is not True:
                  print(f"::error::{key} must be true")
                  sys.exit(1)

          print("entitlements (the IPA is unsigned, so a sideloader re-applies these):")
          for key in sorted(entitlements):
              print(f"  {key} = {entitlements[key]}")
          PY

          # Declaring them is not the same as using them: the target has to have
          # the file wired as CODE_SIGN_ENTITLEMENTS, or a signed build would
          # ship without any of it.
          settings="$(xcodebuild -project XForge.xcodeproj -scheme XForge \
            -destination 'generic/platform=iOS' -showBuildSettings 2>/dev/null)"
          echo "$settings" | grep -q "CODE_SIGN_ENTITLEMENTS" \
            || { echo "::error::the target sets no CODE_SIGN_ENTITLEMENTS"; exit 1; }
          case "$settings" in
            *XForge.entitlements*) echo "wired: $(echo "$settings" | grep "CODE_SIGN_ENTITLEMENTS" | head -1 | sed 's/^ *//')" ;;
            *) echo "::error::CODE_SIGN_ENTITLEMENTS does not point at Support/XForge.entitlements"; exit 1 ;;
          esac

          {
            echo "### Entitlements"
            echo
            echo '```'
            echo "$settings" | grep "CODE_SIGN_ENTITLEMENTS" | head -1 | sed 's/^ *//'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package unsigned IPA
        run: |
          set -e
          APP="build/XForge.xcarchive/Products/Applications/XForge.app"
          IPA="dist/XForge-0.5.0-unsigned.ipa"
          mkdir -p dist/Payload
          ditto "$APP" dist/Payload/XForge.app
          ditto -c -k --keepParent dist/Payload "$IPA"
          unzip -l "$IPA" | grep -q 'Payload/XForge.app/XForge$'
          unzip -l "$IPA" | grep -q 'Payload/XForge.app/alpine-minirootfs-3.23.3-aarch64.tar.gz$'
          echo "ipa: $(du -h "$IPA" | cut -f1)"
          echo "artifact=$GITHUB_WORKSPACE/$IPA" >> "$GITHUB_ENV"
          echo "ipa_name=$(basename "$IPA")" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XForge-unsigned-ipa
          path: dist/XForge-0.5.0-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload to release (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: xforge-${{ github.run_number }}
          name: XForge 0.5.0 — plain Alpine terminal
          files: dist/XForge-0.5.0-unsigned.ipa
          body_path: CHANGELOG.md
          generate_release_notes: false
