name: Run unit tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate --spec project.yml

      - name: Build app for simulator (emits SPM package products)
        run: |
          set -o pipefail
          if ! xcodebuild -project XForge.xcodeproj -scheme XForge \
              -configuration Debug \
              -destination 'platform=iOS Simulator,name=iPhone 16' \
              -derivedDataPath build \
              build > /tmp/build.log 2>&1; then
            echo "--- build diagnostics ---"
            grep -E "error:" /tmp/build.log | sort -u | head -40
            echo "--- last lines ---"
            tail -20 /tmp/build.log
            exit 1
          fi
          tail -5 /tmp/build.log

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild -project XForge.xcodeproj -scheme XForge \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath build \
            test 2>&1 | tee /tmp/test.log | tail -40
          echo "--- summary ---"
          grep -E "Test Suite 'XForgeTests'|Test Case '-\[XForgeTests|Executed [0-9]+ tests|TEST SUCCEEDED|TEST FAILED|error:" /tmp/test.log | tail -25
