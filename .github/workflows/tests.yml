name: Run unit tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate --spec project.yml

      - name: Build app for simulator (emits SPM package products)
        run: |
          set -o pipefail
          xcodebuild -project XForge.xcodeproj -scheme XForge \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath build \
            build 2>&1 | tee /tmp/build.log | tail -8

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild -project XForge.xcodeproj -scheme XForge \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath build \
            test 2>&1 | tee /tmp/test.log | tail -40
          echo "--- summary ---"
          grep -E "Test Suite 'XForgeTests'|Test Case '-\[XForgeTests|Executed [0-9]+ tests|TEST SUCCEEDED|TEST FAILED|error:" /tmp/test.log | tail -25
