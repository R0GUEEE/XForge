name: XForge
options:
  bundleIdPrefix: com.r0gueee
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  xtool:
    url: https://github.com/xtool-org/xtool
    from: 1.17.0
  zipfoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
  xtoolMobileKit:
    url: https://github.com/R0GUEEE/Xtool-iOS-Library
    branch: feature/native-unsigned-backend

# ---------------------------------------------------------------------------
# App identity + shared build settings.
#
# Change the app's identity in ONE place: the three XFORGE_* values below.
# `Support/Info.plist` is generated by XcodeGen from the `info.properties` of
# the XForge target — do not hand-edit it (it is gitignored).
#
# ish-arm64 (Vendor/ish-arm64, a git submodule) provides the embedded Linux engine.
# Its core static libraries are built by EmbeddedLinux/build-ish-core.sh into
# Vendor/ish-arm64-build/lib, where the linker finds them.
# ---------------------------------------------------------------------------
settings:
  base:
    XFORGE_BUNDLE_ID: com.r0gueee.xforge
    XFORGE_DISPLAY_NAME: XForge
    XFORGE_DEVELOPMENT_TEAM: V5GXMU3HC2
    XFORGE_MARKETING_VERSION: "0.5.0"
    XFORGE_BUILD_NUMBER: "8"
    ISH_ROOT: $(SRCROOT)/Vendor/ish-arm64
    ISH_BUILD_DIR: $(SRCROOT)/Vendor/ish-arm64-build
    ISH_LIB_DIR: $(SRCROOT)/Vendor/ish-arm64-build/lib

targets:
  XForge:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Support
      - path: Support/Resources
        buildPhase: resources
        optional: true
      # In-guest provisioning scripts. The terminal can run the toolchain
      # installer and the Build tab can install zsign into the guest before
      # configuring/signing an IPA.
      - path: EmbeddedLinux/install-toolchain.sh
        buildPhase: resources
      - path: EmbeddedLinux/install-zsign.sh
        buildPhase: resources
      - path: EmbeddedLinux/patch-zsign-password-file.py
        buildPhase: resources
    dependencies:
      - package: xtool
        product: XKit
      - package: xtoolMobileKit
        product: XtoolMobileKit
      - package: zipfoundation
        product: ZIPFoundation
      - sdk: WebKit.framework
      - sdk: SystemConfiguration.framework
    preBuildScripts:
      # The engine is a prerequisite of *compiling* this target, not just of
      # linking it: ISHBridge.c includes the engine's headers, and a device build
      # links libish.a / libish_emu.a / libfakefs.a out of $(ISH_LIB_DIR). So this
      # runs before Sources rather than after them.
      #
      # It builds the engine when it is missing or out of date and does nothing
      # otherwise (the engine build records a stamp; see build-ish-core.sh), and it
      # skips itself entirely for simulator builds, which compile the stub branch
      # of the bridge instead. Without it, a plain `xcodebuild` — or any pipeline
      # that does not know to run EmbeddedLinux/build-ish-core.sh first — fails at
      # ISHBridge.c with "'kernel/init.h' file not found".
      - name: Build the embedded Linux engine
        # `bash <path>` rather than the bare path: the phase must not depend on the
        # file's executable bit surviving a checkout.
        script: 'bash "$SRCROOT/EmbeddedLinux/build-engine-for-xcode.sh"'
        basedOnDependencyAnalysis: false
      # The other half of a working app is the guest rootfs, and it cannot be
      # fetched here: it is a resource, so XcodeGen had to see it when it walked the
      # directory (that is why EmbeddedLinux/fetch-rootfs.sh exists and why CI runs
      # it before generating the project). A device build without it produces an app
      # that cannot boot Linux, so this says so instead of shipping it quietly.
      - name: Check the bundled guest rootfs
        script: |
          if [ "${PLATFORM_NAME:-}" != "iphoneos" ] || [ "${XFORGE_SKIP_ROOTFS:-0}" = "1" ]; then
              exit 0
          fi
          if [ -f "${SRCROOT}/Support/Resources/alpine-rootfs.zip" ]; then
              exit 0
          fi
          echo "error: no guest rootfs is staged at Support/Resources/alpine-rootfs.zip, so this app would boot no Linux." >&2
          echo "       Stage the pinned one (about 165 MB) and build again:" >&2
          echo "           bash EmbeddedLinux/fetch-rootfs.sh" >&2
          echo "       Set XFORGE_SKIP_ROOTFS=1 to build without it anyway." >&2
          exit 1
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(XFORGE_BUNDLE_ID)
        MARKETING_VERSION: $(XFORGE_MARKETING_VERSION)
        CURRENT_PROJECT_VERSION: $(XFORGE_BUILD_NUMBER)
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        OTHER_SWIFT_FLAGS: "-Xcc -fmacro-backtrace-limit=0"
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
        # --- signing ------------------------------------------------------
        # Automatic signing with the team above. CI builds pass
        # CODE_SIGNING_ALLOWED=NO (see .github/workflows/unsigned-ipa.yml), so
        # an unsigned IPA can be produced without any certificate.
        DEVELOPMENT_TEAM: $(XFORGE_DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
        # Application targets must be installed into an .xcarchive; making this
        # explicit prevents an Archive action from emitting only build products.
        SKIP_INSTALL: NO
        # --- app icon / accent colour -------------------------------------
        # The entitlements file is checked in and edited by hand (Support/
        # XForge.entitlements explains each key). It is wired in as a build
        # setting rather than through XcodeGen's `entitlements:` block: XcodeGen
        # generates that file from `properties`, and with none declared it wrote
        # an empty plist over it, which silently dropped every entitlement.
        CODE_SIGN_ENTITLEMENTS: $(SRCROOT)/Support/XForge.entitlements
        # The engine's build phase above runs git, Homebrew and meson/ninja, and
        # writes into Vendor/ish-arm64-build — all outside what a sandboxed script
        # phase may touch. Xcode 15+ defaults this to YES for new projects, which
        # would turn the phase into "Operation not permitted".
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # --- embedded ish-arm64 engine (device builds only) -----------------
        # The engine is built for the iOS device (arm64). Simulator builds
        # compile the bridge's stub instead and link nothing extra.
        SWIFT_OBJC_BRIDGING_HEADER: Support/XForge-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/App/EmbeddedVM
          - $(SRCROOT)/App/Services
        "HEADER_SEARCH_PATHS[sdk=iphoneos*]":
          - $(SRCROOT)/App/EmbeddedVM
          - $(SRCROOT)/App/Services
          - $(ISH_ROOT)
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]":
          - $(ISH_LIB_DIR)
        # Must match the guest-arch configuration the core was built with
        # (-Dguest_arch=arm64); struct layouts differ per enabled arch.
        "OTHER_CFLAGS[sdk=iphoneos*]":
          - -DGUEST_ARM64=1
        "OTHER_LDFLAGS[sdk=iphoneos*]":
          - -lish
          - -lish_emu
          - -lfakefs
          - -lz
          - -liconv
          - -lsqlite3
    info:
      path: Support/Info.plist
      properties:
        # Using $(MARKETING_VERSION) rather than XcodeGen's hardcoded "1.0"
        # default is what keeps the built app's version correct.
        CFBundleDisplayName: $(XFORGE_DISPLAY_NAME)
        CFBundleName: $(PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UIRequiredDeviceCapabilities:
          - arm64
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        # The guest makes its own DNS and socket calls in this process, and a
        # home router's resolver is a *local* address. iOS refuses connections
        # to those unless the app declares why -- without this key the user
        # never even gets the prompt, and the failure shows up inside the guest
        # as "DNS: transient error" with a perfectly correct resolv.conf.
        NSLocalNetworkUsageDescription: >-
          XForge runs a Linux guest. Programs in it (apk, wget, git) make their
          own network connections, including to servers on your local network such
          as your router's DNS resolver.
        # The app builds, stores and exports .ipa artifacts in its Documents
        # directory; make that visible in the Files app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  XForgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: XForge
      - package: zipfoundation
        product: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(XFORGE_BUNDLE_ID).Tests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        DEVELOPMENT_TEAM: $(XFORGE_DEVELOPMENT_TEAM)
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/XForge.app/XForge"
        BUNDLE_LOADER: "$(TEST_HOST)"
