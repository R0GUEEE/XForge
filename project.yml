name: XForge
options:
  bundleIdPrefix: org.xforge
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  xtool:
    url: https://github.com/xtool-org/xtool
    from: 1.17.0
  zipfoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19

# ---------------------------------------------------------------------------
# App identity + shared build settings.
#
# Change the app's identity in ONE place: the three XFORGE_* values below.
# `Support/Info.plist` is generated by XcodeGen from the `info.properties` of
# the XForge target — do not hand-edit it (it is gitignored).
#
# iSH-AOK (Vendor/ish-AOK, a git submodule) provides the embedded Linux engine.
# Its core static libraries are built by EmbeddedLinux/build-ish-aok-core.sh into
# Vendor/ish-AOK-build/lib, where the linker finds them.
# ---------------------------------------------------------------------------
settings:
  base:
    XFORGE_BUNDLE_ID: org.xforge.XForge
    XFORGE_DISPLAY_NAME: XForge
    XFORGE_DEVELOPMENT_TEAM: V5GXMU3HC2
    XFORGE_MARKETING_VERSION: "0.3.1"
    XFORGE_BUILD_NUMBER: "3"
    ISH_AOK_ROOT: $(SRCROOT)/Vendor/ish-AOK
    ISH_AOK_LIB_DIR: $(SRCROOT)/Vendor/ish-AOK-build/lib

targets:
  XForge:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Support
      - path: Support/Resources
        buildPhase: resources
        optional: true
      # In-guest provisioning script, run by ToolchainManager.
      - path: EmbeddedLinux/install-toolchain.sh
        buildPhase: resources
    dependencies:
      - package: xtool
        product: XKit
      - package: zipfoundation
        product: ZIPFoundation
      - sdk: WebKit.framework
      - sdk: SystemConfiguration.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(XFORGE_BUNDLE_ID)
        MARKETING_VERSION: $(XFORGE_MARKETING_VERSION)
        CURRENT_PROJECT_VERSION: $(XFORGE_BUILD_NUMBER)
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        OTHER_SWIFT_FLAGS: "-Xcc -fmacro-backtrace-limit=0"
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
        # --- signing ------------------------------------------------------
        # Automatic signing with the team above. CI builds pass
        # CODE_SIGNING_ALLOWED=NO (see .github/workflows/unsigned-ipa.yml), so
        # an unsigned IPA can be produced without any certificate.
        DEVELOPMENT_TEAM: $(XFORGE_DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
        # --- app icon / accent colour -------------------------------------
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # --- embedded iSH-AOK engine (device builds only) -----------------
        # The engine is built for the iOS device (arm64). Simulator builds
        # compile the bridge's stub instead and link nothing extra.
        SWIFT_OBJC_BRIDGING_HEADER: Support/XForge-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/App/EmbeddedVM
        "HEADER_SEARCH_PATHS[sdk=iphoneos*]":
          - $(SRCROOT)/App/EmbeddedVM
          - $(ISH_AOK_ROOT)
          - $(ISH_AOK_ROOT)/deps/libarchive/libarchive
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]":
          - $(ISH_AOK_LIB_DIR)
        # Must match the guest-arch configuration the core was built with
        # (-Dguest_archs=arm64); struct layouts differ per enabled arch.
        "OTHER_CFLAGS[sdk=iphoneos*]":
          - -DISH_GUEST_ARM64=1
          - -DISH_GUEST_I386=0
          - -DISH_GUEST_AMD64=0
          - -DISH_GUEST_RISCV64=0
        "OTHER_LDFLAGS[sdk=iphoneos*]":
          - -lish
          - -lish_emu
          - -lfakefs
          - -lxforge-fakefsimport
          - -larchive
          - -llzma
          - -lbz2
          - -lz
          - -liconv
          - -lsqlite3
    info:
      path: Support/Info.plist
      properties:
        # Using $(MARKETING_VERSION) rather than XcodeGen's hardcoded "1.0"
        # default is what keeps the built app's version correct.
        CFBundleDisplayName: $(XFORGE_DISPLAY_NAME)
        CFBundleName: $(PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UIRequiredDeviceCapabilities:
          - arm64
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        # The app builds, stores and exports .ipa artifacts in its Documents
        # directory; make that visible in the Files app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Support/XForge.entitlements

  XForgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: XForge
      - package: zipfoundation
        product: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(XFORGE_BUNDLE_ID).Tests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        DEVELOPMENT_TEAM: $(XFORGE_DEVELOPMENT_TEAM)
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/XForge.app/XForge"
        BUNDLE_LOADER: "$(TEST_HOST)"
