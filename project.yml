name: XForge
options:
  bundleIdPrefix: com.r0gueee
  # iOS 17 is the floor: XKit (xtool's on-device signing/install library) declares
  # .iOS(.v17), and the native Xcode-project model (XcodeProj) the same.
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  xtool:
    url: https://github.com/xtool-org/xtool
    from: 1.17.0
  zipfoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
  # No XcodeProj package here on purpose. Reading an existing .xcodeproj is done by
  # App/Models/XcodeProject.swift with its own OpenStep parser: the `xtool` package
  # resolves XcodeGen, which pins XcodeProj with `exact:` (9.14.0 today), so asking
  # for an iOS-capable XcodeProj is unsatisfiable — it made SwiftPM's resolver hang
  # for 40+ minutes in CI — and the pinned one declares macOS only.

# ---------------------------------------------------------------------------
# App identity + shared build settings.
#
# Change the app's identity in ONE place: the three XFORGE_* values below.
# `Support/Info.plist` is generated by XcodeGen from the `info.properties` of
# the XForge target — do not hand-edit it (it is gitignored).
#
# The on-device toolchain is linked in from Vendor/NativeToolchain (written by
# NativeToolchain/prepare-xcode.sh); there is no embedded Linux and no engine to
# build. A clone without the toolchain bundle still builds: the bridge compiles
# to a "not available" stub and the app reports that on the Toolchain screen.
# ---------------------------------------------------------------------------
settings:
  base:
    XFORGE_BUNDLE_ID: com.r0gueee.xforge
    XFORGE_DISPLAY_NAME: XForge
    XFORGE_DEVELOPMENT_TEAM: V5GXMU3HC2
    XFORGE_MARKETING_VERSION: "0.5.0"
    XFORGE_BUILD_NUMBER: "8"

targets:
  XForge:
    type: application
    platform: iOS
    configFiles:
      Debug: Support/NativeToolchain.generated.xcconfig
      Release: Support/NativeToolchain.generated.xcconfig
    sources:
      - path: App
      - path: Support
    dependencies:
      - package: xtool
        product: XKit
      - package: zipfoundation
        product: ZIPFoundation
      - sdk: WebKit.framework
      - sdk: SystemConfiguration.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(XFORGE_BUNDLE_ID)
        MARKETING_VERSION: $(XFORGE_MARKETING_VERSION)
        CURRENT_PROJECT_VERSION: $(XFORGE_BUILD_NUMBER)
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        OTHER_SWIFT_FLAGS: "-Xcc -fmacro-backtrace-limit=0"
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
        # --- signing ------------------------------------------------------
        # Automatic signing with the team above. CI builds pass
        # CODE_SIGNING_ALLOWED=NO (see .github/workflows/build-ipa.yml), so
        # an unsigned IPA can be produced without any certificate.
        DEVELOPMENT_TEAM: $(XFORGE_DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
        # Application targets must be installed into an .xcarchive; making this
        # explicit prevents an Archive action from emitting only build products.
        SKIP_INSTALL: NO
        # --- app icon / accent colour -------------------------------------
        # The entitlements file is checked in and edited by hand (Support/
        # XForge.entitlements explains each key). It is wired in as a build
        # setting rather than through XcodeGen's `entitlements:` block: XcodeGen
        # generates that file from `properties`, and with none declared it wrote
        # an empty plist over it, which silently dropped every entitlement.
        CODE_SIGN_ENTITLEMENTS: $(SRCROOT)/Support/XForge.entitlements
        # phase may touch. Xcode 15+ defaults this to YES for new projects, which
        # would turn the phase into "Operation not permitted".
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # --- native compiler bridge -------------------------------------------
        # Hidden for the *guest* headers that used to be here; what remains is the
        # bridge header and whatever toolchain bundle the xcconfig points at.
        SWIFT_OBJC_BRIDGING_HEADER: Support/XForge-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/App/Services
          - $(SRCROOT)/App/NativeToolchain
          - $(XFORGE_NATIVE_HEADER_SEARCH_PATHS)
        "HEADER_SEARCH_PATHS[sdk=iphoneos*]":
          - $(inherited)
          - $(SRCROOT)/App/Services
          - $(SRCROOT)/App/NativeToolchain
          - $(XFORGE_NATIVE_HEADER_SEARCH_PATHS)
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]":
          - $(inherited)
          - $(XFORGE_NATIVE_LIBRARY_SEARCH_PATHS)
        "OTHER_CFLAGS[sdk=iphoneos*]":
          - $(inherited)
          - $(XFORGE_NATIVE_CFLAGS)
        "OTHER_LDFLAGS[sdk=iphoneos*]":
          - $(inherited)
          - $(XFORGE_NATIVE_LDFLAGS)
    info:
      path: Support/Info.plist
      properties:
        # Using $(MARKETING_VERSION) rather than XcodeGen's hardcoded "1.0"
        # default is what keeps the built app's version correct.
        CFBundleDisplayName: $(XFORGE_DISPLAY_NAME)
        CFBundleName: $(PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UIRequiredDeviceCapabilities:
          - arm64
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        # The app builds, stores and exports .ipa artifacts in its Documents
        # directory; make that visible in the Files app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  XForgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: XForge
      - package: zipfoundation
        product: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(XFORGE_BUNDLE_ID).Tests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        DEVELOPMENT_TEAM: $(XFORGE_DEVELOPMENT_TEAM)
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/XForge.app/XForge"
        BUNDLE_LOADER: "$(TEST_HOST)"
